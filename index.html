<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}html,body{height:100%}</style>
<script src="config.js"></script>
</head>
<body>
<title>Sociocracy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed left rail (nav + circle list) beside a single working column; rail collapses to a top bar on phones. */
:root{
  /* Quiet Mono: near-monochrome; color only for circle types and status */
  --bg:#FFFFFF; --surface:#FFFFFF; --sunk:#F4F4F5; --ink:#111113; --muted:#6E6E76; --line:#EAEAEC;
  --accent:#111113; --accent-ink:#FFFFFF; --accent-soft:#F2F2F3;
  --lead:#111113; --deleg:#8B8B93;
  --ok:#1F8A4C; --warn:#A86400; --bad:#C2362F; --info:#2F5BD3;
  --t-mission:#9B4FE0; --t-general:#111113; --t-department:#2F5BD3; --t-helping:#D98300;
  --rail:#FAFAFA;
  --f-display:"Plus Jakarta Sans", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --f-body:"Plus Jakarta Sans", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F0F11; --surface:#141416; --sunk:#1D1D20; --ink:#EDEDEF; --muted:#9A9AA3; --line:#2A2A2E;
  --accent:#EDEDEF; --accent-ink:#111113; --accent-soft:#222226;
  --lead:#EDEDEF; --deleg:#8B8B93;
  --ok:#5CC98A; --warn:#E3A848; --bad:#F0736A; --info:#7CA2F0;
  --t-mission:#C08AF5; --t-general:#EDEDEF; --t-department:#7CA2F0; --t-helping:#F0A830;
  --rail:#121214;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F0F11; --surface:#141416; --sunk:#1D1D20; --ink:#EDEDEF; --muted:#9A9AA3; --line:#2A2A2E;
  --accent:#EDEDEF; --accent-ink:#111113; --accent-soft:#222226;
  --lead:#EDEDEF; --deleg:#8B8B93;
  --ok:#5CC98A; --warn:#E3A848; --bad:#F0736A; --info:#7CA2F0;
  --t-mission:#C08AF5; --t-general:#EDEDEF; --t-department:#7CA2F0; --t-helping:#F0A830;
  --rail:#121214;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.2;margin:0;text-wrap:balance;font-weight:700}
h1{font-size:30px;letter-spacing:-.01em} h2{font-size:21px} h3{font-size:17px} h4{font-size:14px}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}

.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid var(--line);background:var(--surface);padding:20px 14px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-size:17px;display:block;line-height:1.1}
.brand span{font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:700;font-size:14px}
.nav a:hover{background:var(--sunk)}
.nav a.on{background:var(--accent-soft);color:var(--ink)}
.nav a .dot{width:8px;height:8px;border-radius:50%;flex:none}
.rail-sec{display:flex;flex-direction:column;gap:2px}
.rail-sec .eyebrow{padding:0 10px 4px}
.rail-sec a{font-weight:400;padding:6px 10px 6px calc(10px + var(--d,0) * 12px)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 6px}
.mode{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--muted)}
.mode i{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--muted)}
.mode.shared i{background:var(--ok)} .mode.local i{background:var(--warn)}

.main{min-width:0;padding-block:28px 80px;padding-left:max(28px, env(safe-area-inset-left, 0px));padding-right:max(28px, env(safe-area-inset-right, 0px))}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.head .t{display:flex;flex-direction:column;gap:6px;min-width:0}
.head p{color:var(--muted);max-width:62ch}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:700;font-size:14px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn.danger{color:var(--bad)}
.ro .w{display:none!important}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel > .ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;align-items:start}
.cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;align-items:start}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink)}
.stat b{font-family:var(--f-display);font-size:28px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.stat.alert b{color:var(--warn)}
.stats.mini .stat{padding:10px 14px;flex-direction:row;align-items:baseline;gap:8px}
.stats.mini .stat b{font-size:22px}
.upcoming{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.upcoming summary{display:flex;align-items:baseline;gap:12px;padding:14px 20px;cursor:pointer;list-style:none;flex-wrap:wrap}
.upcoming summary::-webkit-details-marker{display:none}
.upcoming summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);align-self:center;transition:transform .15s}
.upcoming[open] summary::before{transform:rotate(45deg)}
.up-t{font-family:var(--f-display);font-weight:700;font-size:17px}
.up-hint{margin-left:auto;font-size:13px;font-weight:700;color:var(--accent)}
.up-body{padding:0 20px 16px}
.fsep{width:1px;align-self:stretch;background:var(--line);margin:2px 4px}
.fcount{font-family:var(--f-mono);font-size:11.5px;opacity:.7;margin-left:2px}
.flate{margin-left:6px;font-size:11.5px;font-weight:700;color:var(--bad)}
.filters button.on .flate{background:var(--bad);color:#fff;border-radius:999px;padding:1px 7px}
.homegrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,360px);grid-template-rows:auto 1fr;grid-template-areas:"feed up" "feed take";gap:18px;align-items:start}
.h-feed{grid-area:feed} .h-up{grid-area:up;min-width:0} .h-take{grid-area:take}
@media (max-width: 960px){ .homegrid{grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-template-areas:"up" "feed" "take"} }

.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--ink);white-space:nowrap}
.chip.t-mission{background:color-mix(in srgb,var(--t-mission) 18%,var(--surface));}
.chip.t-general{background:color-mix(in srgb,var(--t-general) 18%,var(--surface));}
.chip.t-department{background:color-mix(in srgb,var(--t-department) 18%,var(--surface));}
.chip.t-helping{background:color-mix(in srgb,var(--t-helping) 20%,var(--surface));}
.chip i{width:7px;height:7px;border-radius:50%}
.st{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.st.ok{color:var(--ok)} .st.warn{color:var(--warn)} .st.bad{color:var(--bad)} .st.info{color:var(--info)} .st.mute{color:var(--muted)}

.list{display:flex;flex-direction:column}
.item{display:flex;gap:14px;padding:12px 0;border-top:1px solid var(--line);align-items:flex-start;min-width:0}
.item:first-child{border-top:0;padding-top:0}
.item .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.item .body a.ttl{font-weight:700;color:var(--ink);text-decoration:none}
.item .body a.ttl:hover{text-decoration:underline}
.item .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.empty{padding:22px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);text-align:left;display:flex;flex-direction:column;gap:10px;align-items:flex-start}

.ccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
.ccard:hover{border-color:var(--muted)}
.ccard .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ccard p{color:var(--muted);font-size:14px}
.roles-mini{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px}
.roles-mini dt{color:var(--muted)} .roles-mini dd{margin:0;min-width:0;overflow-wrap:anywhere}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs a{padding:9px 14px;text-decoration:none;color:var(--muted);font-weight:700;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a.on{color:var(--ink);border-bottom-color:var(--accent)}
.tabs a .n{font-family:var(--f-mono);font-size:11.5px;margin-left:5px;color:var(--muted)}

.def{display:flex;flex-direction:column;gap:4px}
.def .txt{white-space:pre-wrap;overflow-wrap:anywhere}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;padding:6px 10px 6px 0;border-bottom:1px solid var(--line)}
td{padding:9px 10px 9px 0;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
tr:last-child td{border-bottom:0}
.tscroll{overflow-x:auto}
.people{display:flex;flex-wrap:wrap;gap:6px}
.person{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border-radius:999px;background:var(--sunk);font-size:13.5px}
.av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:var(--accent-ink);background:var(--accent)}

/* Map */
.mapbox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.mapbox svg{display:block;margin:0 auto}
.map-node{cursor:pointer}
.map-node:hover .ring{stroke-width:3}
.map-node:focus-visible{outline:none}
.map-node:focus-visible .ring{stroke-width:4}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend svg{flex:none}

/* Notices */
.notice{display:flex;flex-direction:column;gap:8px;padding:16px 0;border-top:1px solid var(--line)}
.notice:first-child{border-top:0;padding-top:0}
.notice .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.notice .txt{white-space:pre-wrap;overflow-wrap:anywhere;max-width:70ch}
.kind{font-size:12px;font-weight:700;padding:2px 9px;border-radius:4px;background:var(--sunk)}
.kind.decision{background:color-mix(in srgb,var(--ok) 18%,var(--surface))}
.kind.policy{background:color-mix(in srgb,var(--info) 18%,var(--surface))}
.kind.role{background:color-mix(in srgb,var(--deleg) 18%,var(--surface))}
.kind.input{background:color-mix(in srgb,var(--warn) 22%,var(--surface))}
.everyone{font-size:12px;font-weight:700;color:var(--bad)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer}
.filters button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Minutes */
.minutes{display:flex;flex-direction:column;gap:0}
.step{display:grid;grid-template-columns:34px minmax(0,1fr);gap:14px;padding:16px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.step .no{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-family:var(--f-mono);font-size:12.5px;font-weight:500}
.step .c{display:flex;flex-direction:column;gap:8px;min-width:0}
.ag{border-left:3px solid var(--line);padding:2px 0 2px 14px;display:flex;flex-direction:column;gap:6px}
.ag.decide{border-color:var(--ok)} .ag.select{border-color:var(--deleg)} .ag.review{border-color:var(--info)} .ag.explore{border-color:var(--warn)}
.takeaway{background:var(--accent-soft);border-radius:8px;padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere}
.takeaway b{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}

/* Consent process track */
.track{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.track div{font-size:12px;padding:8px 6px 0;border-top:4px solid var(--line);color:var(--muted)}
.track div.done{border-color:var(--accent);color:var(--ink)}
.track div.now{border-color:var(--warn);color:var(--ink);font-weight:700}

/* Modal */
.ov{position:fixed;inset:0;background:rgb(10 14 12 / .45);display:flex;justify-content:center;align-items:flex-start;padding:max(24px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 24px max(12px, env(safe-area-inset-left, 0px));overflow-y:auto;z-index:50}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:100%;max-width:680px;display:flex;flex-direction:column;box-shadow:0 20px 60px rgb(0 0 0 / .25)}
.modal.wide{max-width:900px}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);gap:10px}
.modal .mb{padding:20px;display:flex;flex-direction:column;gap:16px}
.modal .mf{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap;position:sticky;bottom:0;background:var(--surface);border-radius:0 0 14px 14px}
.modal .mf .sp{flex:1}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f > span{font-weight:700;font-size:13.5px}
.f small{color:var(--muted);font-size:12.5px}
.f input:not([type=checkbox]),.f select,.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.f textarea{resize:vertical;min-height:70px}
.f input.bad{border-color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fs{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;margin:0;min-width:0}
.fs > legend{font-family:var(--f-display);font-weight:700;padding:0 6px;font-size:15px}
.fs .hint{color:var(--muted);font-size:13px;margin-top:-4px}
.rep{display:flex;flex-direction:column;gap:12px}
.reprow{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.reprow .rh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px}
.chks{display:flex;flex-wrap:wrap;gap:6px 16px}

.toast{position:fixed;left:50%;bottom:max(20px, env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
.banner{border:1px solid var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--surface));border-radius:var(--r);padding:12px 16px;display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;font-size:14px}

.guide{display:flex;flex-direction:column;gap:18px}
.guide .panel p, .guide .panel li{max-width:68ch}
.guide ol, .guide ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.toc{display:flex;flex-wrap:wrap;gap:6px}
.toc a{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--sunk);color:var(--ink);text-decoration:none}

/* Work */
.sel{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;max-width:100%}
.stack{display:flex;flex-direction:column;gap:8px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.pcard{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface);min-width:0}
.pcard.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.pcard .ttl{font-weight:700;color:var(--ink);text-decoration:none}
.pbar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 12px;font-size:13px;cursor:pointer;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg)}
.board{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:12px;overflow-x:auto;padding-bottom:4px}
.col{background:var(--sunk);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:140px}
.col.over{outline:2px dashed var(--accent);outline-offset:-2px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.tcard:hover{border-color:var(--muted)}
.tcard.prio-high{border-left:3px solid var(--bad)}
.tcard.dragging{opacity:.4}
.tcard .tt{overflow-wrap:anywhere;font-size:14px}
.ckrow{display:flex;gap:8px;align-items:center}
.ckin{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px}
/* Wiki */
.prose{max-width:none;line-height:1.65;gap:0;display:block}
.prose > *{max-width:70ch}
.prose h2{font-size:22px;margin:22px 0 8px} .prose h3{font-size:18px;margin:18px 0 6px} .prose h4{font-size:15px;margin:14px 0 4px}
.prose > :first-child{margin-top:0}
.prose p{margin:0 0 12px} .prose ul,.prose ol{margin:0 0 12px;padding-left:22px} .prose li{margin:3px 0}
.prose blockquote{margin:0 0 12px;padding:8px 14px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0}
.prose code{font-family:var(--f-mono);font-size:.9em;background:var(--sunk);padding:1px 5px;border-radius:4px}

<script>
/* ============ Constants ============ */
const COLS = ['circles','meetings','proposals','actions','notices','selections','projects','wiki','courses','people','contacts','org'];
const CTYPES = {mission:'Mission circle', general:'General circle', department:'Department circle', helping:'Helping circle'};
const ROLE_KEYS = [
  ['leader','Leader','Selected by the parent circle. Holds the operational overview and links down from the parent circle.'],
  ['delegate','Delegate','Selected by this circle. Represents this circle as a full member of the parent circle.'],
  ['facilitator','Facilitator','Runs meetings, keeps the meeting format and the consent process.'],
  ['secretary','Secretary','Prepares agendas with the leader and facilitator, keeps minutes and the logbook.']
];
const AG_TYPES = {report:'Report', explore:'Explore', decide:'Consent decision', select:'Role selection', review:'Policy review'};
const STAGES = {
  forming:{label:'Forming', cls:'info'},
  ready:{label:'Ready for consent', cls:'warn'},
  objection:{label:'Integrating objections', cls:'bad'},
  consented:{label:'Consented', cls:'ok'},
  notconsented:{label:'Not consented', cls:'bad'},
  withdrawn:{label:'Withdrawn', cls:'mute'}
};
const KINDS = {decision:'Decision', policy:'Policy change', role:'Role change', news:'Announcement', input:'Input wanted'};
const A_STATUS = {todo:['To do','info'], doing:['In progress','warn'], blocked:['Blocked','bad'], done:['Done','ok']};
const LS_KEY = 'circle-commons-data-v1';
const DEFAULT_LOGO = `<svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="9" r="6" fill="none" stroke="var(--accent)" stroke-width="2"/><circle cx="8" cy="21" r="5" fill="none" stroke="var(--deleg)" stroke-width="2"/><circle cx="22" cy="21" r="5" fill="none" stroke="var(--info)" stroke-width="2"/></svg>`;
let curLogo = null;

/* ============ State ============ */
const S = {circles:{}, meetings:{}, proposals:{}, actions:{}, notices:{}, selections:{}, projects:{}, wiki:{}, courses:{}, people:{}, contacts:{}, org:{}};
const ROLE_LABEL = Object.fromEntries(ROLE_KEYS.map(([k,l])=>[k,l]));
let searchQ = '';
let upOpen = false;
let mode = 'loading';  // loading | shared | local
let db = null;
let canWrite = true;
let noticeFilter = 'all';
const loaded = new Set();

/* ============ Helpers ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
function mdy(iso){ if(!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return ''; const [y,m,d] = iso.split('-'); return `${m}/${d}/${y}`; }
function parseMDY(s){
  s = (s||'').trim(); if(!s) return {ok:true, iso:''};
  const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); if(!m) return {ok:false};
  const mo = +m[1], d = +m[2], y = +m[3];
  const dt = new Date(y, mo-1, d);
  if(dt.getFullYear()!==y || dt.getMonth()!==mo-1 || dt.getDate()!==d) return {ok:false};
  return {ok:true, iso:`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`};
}
function daysUntil(iso){ if(!iso) return null; const [y,m,d]=iso.split('-').map(Number); const t=new Date(y,m-1,d); const n=new Date(); n.setHours(0,0,0,0); return Math.round((t-n)/86400000); }
const initials = n => ((n||'').trim().split(/\s+/).filter(w=>/^\p{L}/u.test(w)).slice(0,2).map(w=>w[0]).join('') || '?').toUpperCase();
const txt = s => esc(s);
const vals = col => Object.values(S[col]);
const circleName = id => S.circles[id]?.name || 'Community-wide';
const byDateDesc = k => (a,b) => (b[k]||'').localeCompare(a[k]||'');
const clone = o => JSON.parse(JSON.stringify(o));
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2800); }

/* ============ Data layer (portable) ============
   Shared mode: the claude.ai artifact database (everyone sees the same data, live).
   Local mode: this browser only (used when the page runs outside claude.ai).
   To move to your own backend later, replace put(), remove() and startShared(). */
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }
function startLocal(){
  try{ const raw = JSON.parse(localStorage.getItem(LS_KEY) || '{}'); COLS.forEach(c => S[c] = raw[c] || {}); }catch(e){}
  mode = 'local'; render();
}
async function startShared(){
  mode = 'shared';
  const timer = setTimeout(() => { if(loaded.size < COLS.length) { toast('Still waiting for shared data. It may be out of date.'); } }, 10000);
  COLS.forEach(col => {
    db.collection(col).onSnapshot(snap => {
      S[col] = Object.fromEntries(snap.docs.map(d => [d.id, {...d.data(), id:d.id}]));
      if(!snap.metadata.fromCache) loaded.add(col);
      if(loaded.size === COLS.length) clearTimeout(timer);
      render();
    }, err => { clearTimeout(timer); loaded.add(col); if(err.code !== 'revoked') toast('Could not load ' + col + '.'); render(); });
  });
  render();
}
async function put(col, obj){
  const prev = S[col][obj.id];
  S[col][obj.id] = obj;
  if(mode === 'supabase'){
    if(!(await sbPut(col, obj))){ if(prev) S[col][obj.id] = prev; else delete S[col][obj.id]; render(); return false; }
  } else if(mode === 'shared'){
    try{ await db.collection(col).doc(obj.id).set(obj); }
    catch(e){
      if(e && e.code === 'invalid_argument'){ canWrite = false; document.body.classList.add('ro'); toast('You have view-only access, so changes cannot be saved.'); }
      else if(e && e.code === 'quota_exceeded'){ toast('Storage is full. Delete old records to save new ones.'); }
      else toast('Could not save. Try again.');
      return false;
    }
  } else saveLocal();
  render(); return true;
}
async function remove(col, id){
  delete S[col][id];
  if(mode === 'supabase'){ await sbRemove(col, id); }
  else if(mode === 'shared'){ try{ await db.collection(col).doc(id).delete(); }catch(e){ toast('Could not delete. Try again.'); } }
  else saveLocal();
  render();
}
async function boot(){
  render();
  const cfg = window.CC_CONFIG || {};
  if(cfg.supabaseUrl && cfg.supabaseKey){ startSupabase(cfg); return; }
  if(!window.claude || !window.claude.use){ startLocal(); return; }
  try{
    db = await window.claude.use('db');
    if(!db){ startLocal(); return; }
    const user = await window.claude.use('user');
    const w = user ? await user.can('data.write') : null;
    if(w === false){ canWrite = false; document.body.classList.add('ro'); }
    startShared();
  }catch(e){ startLocal(); }
}

/* ============ Derived data ============ */
function people(){ return allPeopleNames(); }
function childrenOf(id){ return vals('circles').filter(c => c.parentId === id).sort((a,b)=>(a.name||'').localeCompare(b.name||'')); }
function roots(){ const ids = new Set(Object.keys(S.circles)); return vals('circles').filter(c => !c.parentId || !ids.has(c.parentId)).sort((a,b)=>typeOrder(a)-typeOrder(b) || (a.name||'').localeCompare(b.name||'')); }
function typeOrder(c){ return ['mission','general','department','helping'].indexOf(c.type); }
function isDescendant(candidate, ancestor){ let cur = S.circles[candidate], guard = 0; while(cur && guard++ < 50){ if(cur.parentId === ancestor) return true; cur = S.circles[cur.parentId]; } return false; }
function ordered(){ const out=[]; const seen=new Set(); const walk=(c,d)=>{ if(seen.has(c.id)) return; seen.add(c.id); out.push([c,d]); childrenOf(c.id).forEach(k=>walk(k,d+1)); }; roots().forEach(r=>walk(r,0)); vals('circles').forEach(c=>{ if(!seen.has(c.id)) walk(c,0); }); return out; }
function roleState(r){ if(!r || !r.holder) return ['Vacant','bad']; const d = daysUntil(r.termEnd); if(d === null) return ['Filled','ok']; if(d < 0) return ['Term ended','bad']; if(d <= 30) return ['Ends soon','warn']; return ['Filled','ok']; }
function needsRole(c, key){ if(key==='leader' || key==='delegate'){ return !!(c.parentId && S.circles[c.parentId]); } return true; }
function roleGaps(){ const g=[]; vals('circles').forEach(c => ROLE_KEYS.forEach(([k,label]) => { if(!needsRole(c,k)) return; const [s,cls] = roleState(c.roles?.[k]); if(cls!=='ok') g.push({c, k, label, s, cls, r:c.roles?.[k]}); })); return g; }
function circleMeetings(id){ return vals('meetings').filter(m => m.circleId === id).sort(byDateDesc('date')); }
function circleProposals(id){ return vals('proposals').filter(p => p.circleId === id).sort(byDateDesc('created')); }
function circleActions(id){ return vals('actions').filter(a => a.circleId === id); }
function openActions(list){ return list.filter(a => a.status !== 'done'); }
function examplesPresent(){ return COLS.some(c => vals(c).some(d => d.example)); }

/* ---------- Map ---------- */
function wrapWords(s, max){ const words=(s||'').split(/\s+/); const lines=[]; let cur=''; words.forEach(w=>{ if((cur+' '+w).trim().length>max && cur){ lines.push(cur); cur=w; } else cur=(cur+' '+w).trim(); }); if(cur) lines.push(cur); return lines.slice(0,3); }
function vMap(){
  const list = vals('circles');
  const head = `<div class="head"><div class="t"><span class="eyebrow">Structure</span><h1>Circle map</h1><p>Circles sit around the general circle. Each one is joined to the circle it belongs to by two lines: the <b>leader</b>, selected by the general circle, carries information to the circle, and the <b>delegate</b>, selected by the circle, carries its voice back. Select a circle to see its aim, domain and people.</p></div></div>`;
  if(!list.length) return head + emptyBox('No circles yet. Create them on the Circles page and they appear here.', `<a class="btn sm" href="#circles">Go to Circles</a>`);
  // Radial layout: the general circle in the middle, its circles around it, sub-circles further out
  const R = 34, RC = 58, LABEL = 96;
  const ids = new Set(list.map(c => c.id));
  const center = list.find(c => c.type === 'general') || roots()[0] || list[0];
  const nb = {}; list.forEach(c => nb[c.id] = []);
  list.forEach(c => { if(c.parentId && ids.has(c.parentId) && c.parentId !== c.id){ nb[c.id].push(c.parentId); nb[c.parentId].push(c.id); } });
  const byName = (a,b) => { const A = S.circles[a], B = S.circles[b]; return (A.id===center.parentId?-1:0)-(B.id===center.parentId?-1:0) || typeOrder(A)-typeOrder(B) || (A.name||'').localeCompare(B.name||''); };
  const par = {}, kids = {}, depth = {}, linked = {};
  const bfs = (root, d0) => { const q = [root]; depth[root] = d0; while(q.length){ const u = q.shift(); kids[u] = kids[u] || []; nb[u].slice().sort(byName).forEach(v => { if(!(v in par) && v !== center.id){ par[v] = u; linked[v] = true; depth[v] = depth[u] + 1; kids[u].push(v); q.push(v); } }); } };
  par[center.id] = null; bfs(center.id, 0);
  ordered().forEach(([c]) => { if(!(c.id in par)){ par[c.id] = center.id; linked[c.id] = false; depth[c.id] = 1; kids[center.id].push(c.id); bfs(c.id, 1); } });
  const weight = u => kids[u] && kids[u].length ? kids[u].reduce((s,k) => s + weight(k), 0) : 1;
  const ring1 = kids[center.id];
  const n1 = ring1.length;
  const r1 = Math.max(205, n1 * 150 / (2*Math.PI)), STEP = 150;
  const maxDepth = Math.max(0, ...Object.values(depth));
  const C = 0;
  const pos = {[center.id]:{x:C, y:C, a:Math.PI/2}};
  const total = ring1.reduce((s,k) => s + weight(k), 0) || 1;
  const spread = (u, a0, a1) => { const ch = kids[u] || []; const tw = ch.reduce((s,k) => s + weight(k), 0) || 1; let a = a0; ch.forEach(k => { const span = (a1 - a0) * weight(k) / tw; const mid = a + span/2; const r = r1 + (depth[k]-1) * STEP; pos[k] = {x:C + r*Math.cos(mid), y:C + r*Math.sin(mid), a:mid}; spread(k, a, a + span); a += span; }); };
  if(n1){ const firstSpan = 2*Math.PI * weight(ring1[0]) / total; const start = -Math.PI/2 - firstSpan/2; spread(center.id, start, start + 2*Math.PI); }
  const rad = id => id === center.id ? RC : R;
  let links = '', nodes = '';
  const segs = [];
  Object.keys(par).forEach(u => {
    const p = par[u]; if(!p || !linked[u] || !pos[u] || !pos[p]) return;
    const child = S.circles[u].parentId === p ? S.circles[u] : S.circles[p];
    const parent = child.id === u ? S.circles[p] : S.circles[u];
    const P = pos[parent.id], Q = pos[child.id];
    segs.push([P.x, P.y, Q.x, Q.y]);
    const dx = Q.x - P.x, dy = Q.y - P.y, len = Math.hypot(dx, dy) || 1, ux = dx/len, uy = dy/len, nx = -uy, ny = ux;
    const seg = o => { const s0 = rad(parent.id) + 12, s1 = rad(child.id) + 12; return [P.x + ux*s0 + nx*o, P.y + uy*s0 + ny*o, Q.x - ux*s1 + nx*o, Q.y - uy*s1 + ny*o].map(v => v.toFixed(1)); };
    const L = child.roles?.leader?.holder, D = child.roles?.delegate?.holder;
    const [a1,b1,a2,b2] = seg(-4), [c1,d1,c2,d2] = seg(4);
    links += `<line x1="${a1}" y1="${b1}" x2="${a2}" y2="${b2}" stroke="var(--lead)" stroke-width="2" marker-end="url(#arL)" ${L?'':'stroke-dasharray="5 4" opacity=".5"'}><title>Leader of ${esc(child.name)}: ${esc(L||'not selected')} (selected by ${esc(parent.name)})</title></line>`;
    links += `<line x1="${c2}" y1="${d2}" x2="${c1}" y2="${d1}" stroke="var(--deleg)" stroke-width="2" marker-end="url(#arD)" ${D?'':'stroke-dasharray="5 4" opacity=".5"'}><title>Delegate of ${esc(child.name)}: ${esc(D||'not selected')} (selected by ${esc(child.name)})</title></line>`;
  });
  Object.keys(pos).forEach(id => {
    const c = S.circles[id]; if(!c) return;
    const {x:X, y:Y, a} = pos[id]; const r = rad(id), t = c.type || 'department';
    const mem = (c.members||[]).length; const dots = Math.min(mem, 16);
    let dotSvg = '';
    for(let i=0;i<dots;i++){ const ang = -Math.PI/2 + i*(2*Math.PI/Math.max(dots,1)); dotSvg += `<circle cx="${(X+Math.cos(ang)*(r+7)).toFixed(1)}" cy="${(Y+Math.sin(ang)*(r+7)).toFixed(1)}" r="2.6" fill="var(--t-${t})"/>`; }
    const gaps = ROLE_KEYS.filter(([k])=>needsRole(c,k) && roleState(c.roles?.[k])[1]!=='ok').length;
    const lines = wrapWords(c.name, 18);
    if(id === center.id){
      const inner = wrapWords(c.name, 12);
      nodes += `<g class="map-node" tabindex="0" role="link" aria-label="${esc(c.name)}" data-act="goCircle" data-id="${c.id}">
        <circle class="ring" cx="${X}" cy="${Y}" r="${r}" fill="color-mix(in srgb, var(--t-${t}) 10%, var(--surface))" stroke="var(--t-${t})" stroke-width="2.5"/>
        ${dotSvg}
        ${inner.map((l,i)=>`<text x="${X}" y="${Y - (inner.length-1)*8 + i*16 - 4}" text-anchor="middle" dominant-baseline="middle" font-family="var(--f-display)" font-weight="700" font-size="14" fill="var(--ink)">${esc(l)}</text>`).join('')}
        <text x="${X}" y="${Y + (inner.length-1)*8 + 16}" text-anchor="middle" dominant-baseline="middle" font-size="10.5" fill="var(--muted)">${mem} member${mem===1?'':'s'}</text>
        ${gaps?`<circle cx="${(X+r*0.72).toFixed(1)}" cy="${(Y-r*0.72).toFixed(1)}" r="8" fill="var(--warn)"/><text x="${(X+r*0.72).toFixed(1)}" y="${(Y-r*0.72+0.5).toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="10" font-weight="700" fill="var(--surface)">${gaps}</text>`:''}
      </g>`;
      return;
    }
    // Pick a label spot that does not touch any line or other circle
    const typeText = (CTYPES[t]||'').toUpperCase();
    const lw = Math.max(...lines.map(l => l.length * 7.6), typeText.length * 7.0), lh = lines.length*15 + 16;
    const free = (x0, y0) => {
      const x1 = x0 + lw, y1 = y0 + lh, pad = 4;
      for(const [ax,ay,bx,by] of segs){ for(let k=0;k<=24;k++){ const px = ax + (bx-ax)*k/24, py = ay + (by-ay)*k/24; if(px > x0-pad && px < x1+pad && py > y0-pad && py < y1+pad) return false; } }
      for(const oid of Object.keys(pos)){ if(oid === id) continue; const o = pos[oid], orr = rad(oid) + 10; const qx = Math.max(x0, Math.min(o.x, x1)), qy = Math.max(y0, Math.min(o.y, y1)); if(Math.hypot(o.x-qx, o.y-qy) < orr) return false; }
      return true;
    };
    const cand = {
      below: {x0:X - lw/2, y0:Y + r + 9, lx:X, anchor:'middle'},
      above: {x0:X - lw/2, y0:Y - r - 9 - lh, lx:X, anchor:'middle'},
      right: {x0:X + r + 12, y0:Y - lh/2, lx:X + r + 12, anchor:'start'},
      left:  {x0:X - r - 12 - lw, y0:Y - lh/2, lx:X - r - 12, anchor:'end'}
    };
    const pref = Math.sin(a) < -0.35 ? ['above','below'] : ['below','above'];
    const sides = Math.cos(a) >= 0 ? ['right','left'] : ['left','right'];
    const pick = cand[[...pref, ...sides].find(k => free(cand[k].x0, cand[k].y0)) || pref[0]];
    const lx = pick.lx, anchor = pick.anchor;
    const nameY = i => pick.y0 + 13 + i*15, typeY = pick.y0 + 13 + lines.length*15;
    nodes += `<g class="map-node" tabindex="0" role="link" aria-label="${esc(c.name)}" data-act="goCircle" data-id="${c.id}">
      <circle class="ring" cx="${X.toFixed(1)}" cy="${Y.toFixed(1)}" r="${r}" fill="color-mix(in srgb, var(--t-${t}) 16%, var(--surface))" stroke="var(--t-${t})" stroke-width="2"/>
      ${dotSvg}
      <text x="${X.toFixed(1)}" y="${(Y+1).toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-family="var(--f-display)" font-weight="700" font-size="${id===center.id?20:17}" fill="var(--ink)">${mem}</text>
      <text x="${X.toFixed(1)}" y="${(Y+15).toFixed(1)}" text-anchor="middle" font-size="9.5" fill="var(--muted)">member${mem===1?'':'s'}</text>
      ${gaps?`<circle cx="${(X+r*0.72).toFixed(1)}" cy="${(Y-r*0.72).toFixed(1)}" r="8" fill="var(--warn)"/><text x="${(X+r*0.72).toFixed(1)}" y="${(Y-r*0.72+0.5).toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="10" font-weight="700" fill="var(--surface)">${gaps}</text>`:''}
      ${lines.map((l,i)=>`<text x="${lx.toFixed(1)}" y="${nameY(i).toFixed(1)}" text-anchor="${anchor}" font-size="13" font-weight="700" fill="var(--ink)">${esc(l)}</text>`).join('')}
      <text x="${lx.toFixed(1)}" y="${typeY.toFixed(1)}" text-anchor="${anchor}" font-size="10.5" fill="var(--muted)" letter-spacing=".5">${(CTYPES[t]||'').toUpperCase()}</text>
    </g>`;
  });
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  Object.keys(pos).forEach(id => { const {x, y} = pos[id], r = rad(id); minX = Math.min(minX, x - r - 78); maxX = Math.max(maxX, x + r + 78); minY = Math.min(minY, y - r - 72); maxY = Math.max(maxY, y + r + 84); });
  const width = Math.round(maxX - minX), height = Math.round(maxY - minY), vb = `${minX.toFixed(0)} ${minY.toFixed(0)} ${width} ${height}`;
  const defs = `<defs><marker id="arL" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--lead)"/></marker><marker id="arD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--deleg)"/></marker></defs>`;
  const gl = roleGaps();
  return head + `
  <div class="legend">
    <span><svg width="30" height="10"><line x1="0" y1="5" x2="24" y2="5" stroke="var(--lead)" stroke-width="2"/><path d="M23 1L30 5L23 9z" fill="var(--lead)"/></svg>Leader (out to the circle)</span>
    <span><svg width="30" height="10"><line x1="0" y1="5" x2="24" y2="5" stroke="var(--deleg)" stroke-width="2"/><path d="M23 1L30 5L23 9z" fill="var(--deleg)"/></svg>Delegate (back toward the center)</span>
    <span><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke="var(--muted)" stroke-width="2" stroke-dasharray="4 4"/></svg>Role not selected</span>
    <span><svg width="14" height="14"><circle cx="7" cy="7" r="6" fill="var(--warn)"/></svg>Roles to fill or reselect</span>
    ${Object.keys(CTYPES).map(t=>`<span><svg width="12" height="12"><circle cx="6" cy="6" r="5" fill="var(--t-${t})"/></svg>${CTYPES[t]}</span>`).join('')}
  </div>
  <div class="mapbox"><svg width="${width}" height="${height}" viewBox="${vb}" style="width:100%;height:auto;max-width:${Math.min(width,860)}px;min-width:${Math.min(width,560)}px" role="img" aria-label="Diagram of circles and their links">${defs}${links}${nodes}</svg></div>
  <section class="panel"><div class="ph"><h2>Roles to fill or reselect</h2></div>
    ${gl.length ? `<div class="tscroll"><table><thead><tr><th>Circle</th><th>Role</th><th>Holder</th><th>Term ends</th><th>Status</th><th></th></tr></thead><tbody>${gl.map(g=>`<tr><td><a href="#circle-${g.c.id}">${esc(g.c.name)}</a></td><td>${g.label}</td><td>${esc(g.r?.holder||'—')}</td><td class="mono">${mdy(g.r?.termEnd)||'—'}</td><td>${stChip(g.s,g.cls)}</td><td>${selButton(g.c, g.k)}</td></tr>`).join('')}</tbody></table></div>` : `<p class="muted">Every circle has its roles filled with current terms.</p>`}
  </section>`;
}

/* ---------- Circle page ---------- */
function vCircle(id, tab){
  const c = S.circles[id];
  if(!c) return mode==='loading' ? '' : emptyBox('This circle does not exist or was deleted.', `<a class="btn sm" href="#circles">Back to circles</a>`);
  const parent = S.circles[c.parentId];
  const meets = circleMeetings(id), props = circleProposals(id), acts = circleActions(id);
  const consented = props.filter(p=>p.stage==='consented');
  const tabs = [['about','About'],['meetings','Meetings',meets.length],['proposals','Proposals',props.filter(p=>['forming','ready','objection'].includes(p.stage)).length],['actions','Work',openActions(acts).length],['logbook','Logbook',consented.length]];
  let body = '';
  if(tab==='about') body = cAbout(c);
  if(tab==='meetings') body = cMeetings(c, meets);
  if(tab==='proposals') body = cProposals(c, props);
  if(tab==='actions') body = cWork(c);
  if(tab==='logbook') body = cLogbook(c, consented, meets);
  return `
  <div class="head"><div class="t"><div class="row">${typeChip(c.type)}${parent?`<span class="muted" style="font-size:13px">Within <a href="#circle-${parent.id}">${esc(parent.name)}</a></span>`:''}${c.example?'<span class="chip">Example</span>':''}</div><h1>${esc(c.name)}</h1>${c.aim?`<p>${esc(c.aim)}</p>`:''}</div>

  <nav class="tabs">${tabs.map(([k,l,n])=>`<a href="#circle-${id}-${k}" class="${tab===k?'on':''}">${l}${n?`<span class="n">${n}</span>`:''}</a>`).join('')}</nav>
  ${body}`;
}
function cAbout(c){

  const roleRows = ROLE_KEYS.filter(([k])=>needsRole(c,k)).map(([k,l,desc])=>{ const r=c.roles?.[k]||{}; const rd=c.roleDescs?.[k]||{}; const [s,cls]=roleState(r); return `<tr><td>${descCell(l, rd.responsibilities, rd.qualifications, desc)}</td><td>${r.holder?person(r.holder):'<span class="muted">Not selected</span>'}</td><td class="mono">${mdy(r.selected)||'—'}</td><td class="mono">${mdy(r.termEnd)||'—'}</td><td>${stChip(s,cls)}</td><td>${selButton(c,k)}</td></tr>`; }).join('');

  return `
  <div class="cols">
    <section class="panel"><h2>Aim</h2><div class="def"><span class="eyebrow">What this circle does</span><div class="txt">${esc(c.aim || 'Not written yet.')}</div></div>
      <div class="def"><span class="eyebrow">Domain · what this circle decides</span><div class="txt">${esc(c.domain || 'Not written yet.')}</div></div>
      ${c.description?`<div class="def"><span class="eyebrow">More about this circle</span><div class="txt">${esc(c.description)}</div></div>`:''}
      ${c.rhythm?`<div class="def"><span class="eyebrow">Meeting rhythm</span><div>${esc(c.rhythm)}</div></div>`:''}
    </section>
    <section class="panel"><div class="ph"><h2>Members</h2><span class="muted">${(c.members||[]).length}</span></div>
      ${(c.members||[]).length?`<div class="people">${c.members.map(person).join('')}</div>`:'<p class="muted">No members listed.</p>'}
      ${kids.length?`<div class="def"><span class="eyebrow">Sub-circles</span><div class="row">${kids.map(k=>`<a class="chip t-${k.type||'department'}" href="#circle-${k.id}" style="text-decoration:none">${esc(k.name)}</a>`).join('')}</div></div>`:''}
      ${(() => { const wp = vals('wiki').filter(w => w.circleId === c.id && !(w.courseId && S.courses[w.courseId])); const cs = vals('courses').filter(k => k.circleId === c.id); return (wp.length || cs.length) ? `<div class="def"><span class="eyebrow">Wiki courses and pages this circle looks after</span><div class="row">${cs.map(k => `<a class="chip" href="#course-${k.id}" style="text-decoration:none">Course: ${esc(k.title)}</a>`).join('')}${wp.map(w => `<a class="chip" href="#wiki-${w.id}" style="text-decoration:none">${esc(w.title)}</a>`).join('')}</div></div>` : ''; })()}
      ${c.parentId && S.circles[c.parentId] ? `<p class="muted" style="font-size:13.5px">Linked to <a href="#circle-${c.parentId}">${esc(S.circles[c.parentId].name)}</a> through its leader and delegate.</p>`:''}
    </section>
  </div>
  <section class="panel"><div class="ph"><h2>Roles</h2><div class="row"><button class="btn sm w" data-act="newSelection" data-circle="${c.id}" data-role="new" type="button">Select someone for a new role</button><button class="btn sm w" data-act="editCircle" data-id="${c.id}" type="button">Edit roles directly</button></div></div>
    <p class="muted" style="font-size:13.5px">Use <b>Start selection</b> to run the selection process. When the circle consents, the role holder, term and description update here and a role change is posted to the community board.</p>
    <div class="tscroll"><table><thead><tr><th>Role</th><th>Held by</th><th>Selected</th><th>Term ends</th><th>Status</th><th></th></tr></thead><tbody>${roleRows}${extra}</tbody></table></div>
    ${!c.parentId?'<p class="muted" style="font-size:13px">This circle sits at the top of the structure, so it has no leader or delegate link upward.</p>':''}
  </section>`;
}
function cMeetings(c, meets){

    <section class="panel"><div class="ph"><h2>Meetings</h2><button class="btn sm pri w" data-act="newMeeting" data-circle="${c.id}" type="button">Record a meeting</button></div>
      ${meets.length?`<div class="list">${meets.map(m=>`<div class="item"><span class="mono" style="flex:none;min-width:84px">${mdy(m.date)}</span><div class="body"><a class="ttl" href="#meeting-${m.id}">${esc((m.agenda||[]).map(a=>a.title).filter(Boolean).slice(0,3).join(' · ') || 'Circle meeting')}</a>${m.takeaways?`<div class="clamp muted">${esc(m.takeaways)}</div>`:''}</div><div class="side">${m.status==='published'?stChip('Minutes final','ok'):stChip('Draft','mute')}</div></div>`).join('')}</div>`:emptyBox('No meetings recorded yet. Minutes follow the meeting format: opening round, administrative items, consent to the agenda, agenda items and a closing round.')}

function cProposals(c, props){
  const groups = ['ready','objection','forming','consented','notconsented','withdrawn'];
  return `<section class="panel"><div class="ph"><h2>Proposals</h2><button class="btn sm pri w" data-act="newProposal" data-circle="${c.id}" type="button">New proposal</button></div>
    ${props.length? groups.map(g=>{ const l=props.filter(p=>p.stage===g); if(!l.length) return ''; return `<div class="def"><span class="eyebrow">${STAGES[g].label}</span><div class="list">${l.map(propItem).join('')}</div></div>`; }).join('') : emptyBox('No proposals yet. A proposal starts from a need, gets shaped together, and is decided by consent.')}
  </section>`;
}
function propItem(p){ return `<div class="item"><div class="body"><a class="ttl" href="#proposal-${p.id}">${esc(p.title)}</a>${p.driver?`<div class="clamp muted">${esc(p.driver)}</div>`:''}</div><div class="side">${stChip(STAGES[p.stage]?.label||p.stage, STAGES[p.stage]?.cls||'mute')}${(p.stage==='notconsented'?p.droppedOn:p.decided)?`<span class="mono muted">${mdy(p.stage==='notconsented'?p.droppedOn:p.decided)}</span>`:''}</div></div>`; }
function cLogbook(c, consented, meets){
  const decisions = [];
  meets.forEach(m => (m.agenda||[]).forEach(a => { if((a.type==='decide'||a.type==='select'||a.type==='review') && a.outcome && !a.proposalId) decisions.push({m, a}); }));
  return `<section class="panel"><div class="ph"><h2>Policies in force</h2></div><p class="muted" style="font-size:13.5px">Consented proposals become this circle's policies. Each one has a review date so the circle can check that it still serves the aim.</p>

  </section>
  ${(() => { const nc = vals('proposals').filter(p=>p.circleId===c.id && p.stage==='notconsented').sort(byDateDesc('droppedOn')); return nc.length ? `<section class="panel"><div class="ph"><h2>Proposals not consented</h2></div><p class="muted" style="font-size:13.5px">Kept so the circle remembers why an idea did not pass.</p><div class="list">${nc.map(p=>`<div class="item"><span class="mono" style="flex:none;min-width:84px">${mdy(p.droppedOn)||'—'}</span><div class="body"><a class="ttl" href="#proposal-${p.id}">${esc(p.title)}</a>${p.dropReason?`<div class="muted clamp">${esc(p.dropReason)}</div>`:''}</div><div class="side">${p.followUpId&&S.proposals[p.followUpId]?`<a href="#proposal-${p.followUpId}" style="font-size:13px">New approach</a>`:''}</div></div>`).join('')}</div></section>` : ''; })()}

}

    ['Opening round', m.opening ? `<div class="txt" style="white-space:pre-wrap">${esc(m.opening)}</div>` : '<span class="muted">Not recorded.</span>'],
    ['Administrative items', `<div class="grid2"><div class="def"><span class="eyebrow">Present</span><div>${(m.present||[]).length?`<div class="people">${m.present.map(person).join('')}</div>`:'<span class="muted">Not recorded.</span>'}</div>${(m.absent||[]).length?`<div class="muted" style="font-size:13px">Absent: ${m.absent.map(esc).join(', ')}</div>`:''}</div>
      <div class="def"><span class="eyebrow">Housekeeping</span><div>${m.prevMinutes?'Minutes of the last meeting consented.':'Minutes of the last meeting not reviewed.'}</div>${m.nextDate?`<div>Next meeting: <span class="mono">${mdy(m.nextDate)}</span></div>`:''}</div></div>
      ${m.announcements?`<div class="def"><span class="eyebrow">Announcements</span><div class="txt" style="white-space:pre-wrap">${esc(m.announcements)}</div></div>`:''}`],
    ['Consent to the agenda', m.agendaConsented ? 'The agenda was consented.' : '<span class="muted">Not recorded.</span>'],
    ['Agenda items', (m.agenda||[]).length ? m.agenda.map((a,i)=>`<div class="ag ${a.type}"><div class="row"><b>${esc(a.title||'Untitled item')}</b><span class="kind">${AG_TYPES[a.type]||'Item'}</span>${a.proposalId&&S.proposals[a.proposalId]?`<a href="#proposal-${a.proposalId}" style="font-size:13px">Proposal</a>`:''}</div>${a.notes?`<div style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(a.notes)}</div>`:''}${a.outcome?`<div><span class="eyebrow">Outcome</span><div style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(a.outcome)}</div></div>`:''}${a.takeaway?`<div class="muted" style="font-size:13.5px">Key point: ${esc(a.takeaway)}</div>`:''}<div class="row">${sentHTML(a.sentTo)}${linkTargets(m.circleId).length?`<button class="btn sm w" data-act="sendTo" data-kind="agenda" data-id="${m.id}" data-i="${i}" type="button">Send to another circle</button>`:''}</div></div>`).join('') : '<span class="muted">No agenda items recorded.</span>'],
    ['Closing round', m.closing ? `<div style="white-space:pre-wrap">${esc(m.closing)}</div>` : '<span class="muted">Not recorded.</span>']
  ];
  return `
  <div class="head"><div class="t"><span class="eyebrow">Meeting minutes · ${c?`<a href="#circle-${c.id}-meetings">${esc(c.name)}</a>`:'Deleted circle'}</span><h1><span class="mono" style="font-size:inherit;font-family:inherit">${mdy(m.date)}</span></h1>
    <div class="row">${m.status==='published'?stChip('Minutes final','ok'):stChip('Draft','mute')}${m.facilitator?`<span class="muted" style="font-size:13.5px">Facilitator: ${esc(m.facilitator)}</span>`:''}${m.secretary?`<span class="muted" style="font-size:13.5px">Secretary: ${esc(m.secretary)}</span>`:''}</div></div>

}

function vProposal(id){
  const p = S.proposals[id];
  if(!p) return mode==='loading'?'':emptyBox('This proposal does not exist or was deleted.', `<a class="btn sm" href="#circles">Back to circles</a>`);
  const c = S.circles[p.circleId];
  const order = ['understand','explore','shape','questions','reactions','consent'];
  const labels = ['Understand the need','Explore dimensions','Shape the proposal','Clarifying questions','Quick reactions','Consent round'];
  let reached = 0;
  if(p.understanding||p.driver) reached = 1; if(p.dimensions) reached = 2; if(p.proposal) reached = 3; if(p.questions) reached = 4; if(p.reactions) reached = 5; if(p.stage==='consented'||p.stage==='objection'||p.stage==='notconsented') reached = 6;
  const objs = p.objections || [];
  const sec = (t, v, hint) => `<div class="def"><span class="eyebrow">${t}</span>${v?`<div class="txt">${esc(v)}</div>`:`<div class="muted">${hint}</div>`}</div>`;
  return `
  <div class="head"><div class="t"><span class="eyebrow">Proposal · ${c?`<a href="#circle-${c.id}-proposals">${esc(c.name)}</a>`:'Deleted circle'}</span><h1>${esc(p.title)}</h1>
    <div class="row">${stChip(STAGES[p.stage]?.label||p.stage, STAGES[p.stage]?.cls||'mute')}${p.author?`<span class="muted" style="font-size:13.5px">Brought by ${esc(p.author)}</span>`:''}${p.decided?`<span class="muted" style="font-size:13.5px">Consented <span class="mono">${mdy(p.decided)}</span></span>`:''}${p.reviewDate?`<span class="muted" style="font-size:13.5px">Review by <span class="mono">${mdy(p.reviewDate)}</span></span>`:''}</div></div>
    <div class="row">${p.stage==='consented' ? (() => { const wp = vals('wiki').find(w => w.proposalId === p.id); return wp ? `<a class="btn" href="#wiki-${wp.id}">Read in the wiki</a>` : `<button class="btn w" data-act="wikiFromProposal" data-id="${p.id}" type="button">Add to wiki</button>`; })() : ''}${linkTargets(p.circleId).length?`<button class="btn w" data-act="sendTo" data-kind="proposal" data-id="${p.id}" type="button">Send to another circle</button>`:''}<button class="btn w" data-act="editProposal" data-id="${p.id}" type="button">Update proposal</button></div></div>
  ${(p.sentTo||[]).length?`<div class="row">${sentHTML(p.sentTo)}</div>`:''}
  <div class="track" aria-label="Process progress">${labels.map((l,i)=>`<div class="${i<reached?'done':i===reached&&p.stage!=='withdrawn'?'now':''}">${l}</div>`).join('')}</div>
  ${p.basedOn && S.proposals[p.basedOn] ? `<p class="muted" style="font-size:14px">A new approach to the same need as <a href="#proposal-${p.basedOn}">${esc(S.proposals[p.basedOn].title)}</a>, which was not consented.</p>` : ''}
  ${p.stage==='notconsented' ? (() => { const open = (p.objections||[]).filter(o=>!o.resolved); const fu = p.followUpId && S.proposals[p.followUpId]; return `<section class="panel" style="border-color:var(--bad)"><div class="ph"><h2>Not consented${p.droppedOn?` · <span class="mono" style="font-size:15px">${mdy(p.droppedOn)}</span>`:''}</h2></div>
    <p>The circle could not integrate ${open.length===1?'an objection':open.length?'the objections':'the objections raised'}, so this proposal did not pass. The current way stays in place until a new proposal is consented.</p>
    ${p.dropReason?`<div class="def"><span class="eyebrow">Why it was not consented</span><div class="txt">${esc(p.dropReason)}</div></div>`:''}
    ${open.length?`<div class="def"><span class="eyebrow">Objections that could not be integrated</span><ul style="margin:0;padding-left:20px">${open.map(o=>`<li>${esc(o.concern)}${o.by?` <span class="muted">(${esc(o.by)})</span>`:''}</li>`).join('')}</ul></div>`:''}
    <div class="row">${fu?`<a class="btn" href="#proposal-${fu.id}">See the new proposal: ${esc(fu.title)}</a>`:`<button class="btn pri w" data-act="followUp" data-id="${p.id}" type="button">Start a new proposal for the same need</button>`}</div>
  </section>`; })() : ''}
  <div class="cols">
    <section class="panel"><h2>Forming the proposal</h2>
      ${sec('The need (driver)', p.driver, 'What is happening and what is needed?')}
      ${sec('What we learned', p.understanding, 'Questions asked to understand the situation.')}
      ${sec('Dimensions to address', p.dimensions, 'The aspects any good proposal must cover.')}
      ${sec('Ideas considered', p.ideas, 'Ideas generated before shaping.')}
    </section>
    <section class="panel"><h2>The proposal</h2>
      ${p.proposal?`<div class="txt" style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(p.proposal)}</div>`:'<p class="muted">Not written yet.</p>'}
    </section>
  </div>
  <section class="panel"><h2>Consent process</h2>
    <div class="grid2">${sec('Clarifying questions', p.questions, 'Not recorded yet.')}${sec('Quick reactions', p.reactions, 'Not recorded yet.')}</div>
    <div class="def"><span class="eyebrow">Objections</span>${objs.length?`<div class="tscroll"><table><thead><tr><th>Raised by</th><th>Objection</th><th>${p.stage==='notconsented'?'What was tried':'How it was integrated'}</th><th></th></tr></thead><tbody>${objs.map(o=>`<tr><td>${esc(o.by||'—')}</td><td>${esc(o.concern)}</td><td>${esc(o.resolution||'—')}</td><td>${o.resolved?stChip('Resolved','ok'):stChip(p.stage==='notconsented'?'Not integrated':'Open','bad')}</td></tr>`).join('')}</tbody></table></div>`:`<div class="muted">${p.stage==='consented'?'No objections. Consent was given in the first round.':'None recorded.'}</div>`}</div>
    ${p.meetingId&&S.meetings[p.meetingId]?`<a href="#meeting-${p.meetingId}">See the minutes of the meeting where this was decided</a>`:''}
  </section>`;
}

/* ---------- Guide ---------- */
const STARTER = {course:{title:'Sociocracy basics', summary:'How our organization works: circles, roles, consent, meetings and selections.', description:'A short introduction to sociocracy as we practice it, based on *Many Voices One Song* by Ted J. Rau and Jerry Koch-Gonzalez. Start here if you are new, or come back when you need a refresher.', outcomes:'What circles, aims and domains are\nThe four core roles and double links\nHow consent and objections work\nThe five-step meeting format\nHow proposals are formed and decided\nHow people are selected for roles', modules:[{"id": "m1", "title": "Circles and roles"}, {"id": "m2", "title": "Consent and objections"}, {"id": "m3", "title": "Meetings and proposals"}, {"id": "m4", "title": "Selections"}]}, lessons:[{"moduleId": "m1", "title": "Circles, aims and domains", "summary": "What a circle is, and how it knows what it decides.", "body": "## What a circle is\nA **circle** is a group of people with a shared aim and the authority to make decisions in its own area. Every piece of work in our organization belongs to a circle.\n\n## Aim\nThe **aim** says what the circle does or produces. A clear aim tells everyone what the circle is for, and it is what objections are measured against.\n\n## Domain\nThe **domain** is the area where the circle decides on its own. Decisions outside it go to the circle that holds that domain. Use **Who decides?** to find it.\n\n## Types of circles\n- **General circle**: holds the overview and links the department circles. There is only one.\n- **Mission circle**: keeps the long-term mission and connects to the outside world. There is at most one.\n- **Department circles**: carry out an area of work.\n- **Helping circles**: take on part of a department's work.\n\n> Circles hand parts of their domain to sub-circles, so decisions are made by the people closest to the work."}, {"moduleId": "m1", "title": "Roles and double links", "summary": "The four core roles, and the two people who connect each pair of circles.", "body": "## The four roles\n- **Leader**: selected by the parent circle. Keeps the overview of the circle's work and carries information into the circle.\n- **Delegate**: selected by the circle itself. Is a full member of the parent circle and carries the circle's voice back.\n- **Facilitator**: runs meetings and holds the meeting format and the consent process.\n- **Secretary**: prepares the agenda, keeps the minutes and keeps the logbook current.\n\n## Double links\nBecause a leader and a delegate connect each pair of circles, information and influence flow both ways. You can see every link on the **Circle map**.\n\n## Terms\nEvery role has a term. When it ends, the circle gives the role holder feedback and runs a new selection."}, {"moduleId": "m1", "title": "Where things live in this workspace", "summary": "A quick tour, so you know where to look.", "body": "- **Home**: the community board with decisions and updates for everyone, plus what is coming up.\n- **Circle map**: every circle and its double links.\n- **Circles**: each circle's aim, domain, members and roles, with tabs for meetings, proposals, work and the logbook.\n- **Work**: every task across circles and who is responsible.\n- **Wiki**: courses like this one, and a library of agreements and policies.\n- **Who decides?**: search domains, policies and decisions to find the circle responsible for a topic."}, {"moduleId": "m2", "title": "Consent decision-making", "summary": "How a decision gets made when nobody has to win.", "body": "## Consent\nA decision is made when **nobody has an objection**. Consent does not mean everyone loves the proposal. It means the proposal is within everyone's range of tolerance: *good enough for now, safe enough to try*.\n\n## Why consent\n- Everyone's reasoned concerns are heard.\n- Decisions move forward without waiting for full agreement.\n- A review date means nothing is permanent."}, {"moduleId": "m2", "title": "Objections", "summary": "What counts as an objection, and what to do with one.", "body": "## What an objection is\nAn **objection** is a reasoned argument that a proposal would get in the way of the circle reaching its aim. A preference is not an objection. Share preferences in the quick reactions round.\n\n## Integrating objections\nObjections are welcome because they improve the proposal. The circle works together to change it, for example by:\n- shortening the term or making it a trial\n- adding a review date or a safeguard\n- narrowing the scope"}, {"moduleId": "m2", "title": "When an objection cannot be integrated", "summary": "What happens when a proposal does not pass.", "body": "If an objection cannot be integrated, the proposal is **not consented** and the current way stays in place.\n\n- Record why it was not consented, so the idea does not come back without that context.\n- If the need still matters, start a new proposal for the same need.\n\n> This is not a veto: anyone can also object to an existing policy and put it back on the agenda."}, {"moduleId": "m3", "title": "The meeting format", "summary": "The five steps every circle meeting follows.", "body": "1. **Opening round**: everyone checks in, one at a time.\n2. **Administrative items**: attendance, consent to the last minutes, the next meeting date and short announcements.\n3. **Consent to the agenda**: the circle agrees what it will cover.\n4. **Agenda items**: reports, explorations, proposals for consent, role selections and policy reviews.\n5. **Closing round**: a meeting evaluation of what went well and what can improve.\n\nThe secretary records the minutes, including **key takeaways** for people outside the circle."}, {"moduleId": "m3", "title": "Forming a proposal", "summary": "From a need to a proposal the circle can decide on.", "body": "1. **Understand**: describe the need and ask questions until the circle shares the same picture.\n2. **Explore**: name the dimensions any good solution must address.\n3. **Generate ideas**: collect ideas for each dimension.\n4. **Shape**: one or two people combine the ideas into a proposal."}, {"moduleId": "m3", "title": "The consent process", "summary": "The rounds that turn a proposal into a decision.", "body": "1. Present the proposal.\n2. **Clarifying questions** round: questions only, no opinions.\n3. **Quick reactions** round: everyone shares a short reaction.\n4. **Consent round**: each person says *consent* or *objection*.\n5. **Resolve objections**: understand each one and amend the proposal until it is integrated.\n6. Celebrate, record the decision and set a review date."}, {"moduleId": "m4", "title": "Selecting people for roles", "summary": "How a circle chooses who holds a role, openly and by consent.", "body": "1. Describe the role: responsibilities, qualifications and term.\n2. Everyone writes a nomination without discussion.\n3. **Nomination round**: each person names their nominee and says why.\n4. **Change round**: anyone may change their nomination after hearing the reasons.\n5. The facilitator proposes a candidate based on the reasons given.\n6. **Consent round**, with the candidate speaking last. Objections are resolved as with any proposal.\n\nIn this workspace, use **Start selection** on any role to be guided through these steps."}, {"moduleId": "m4", "title": "Terms and feedback", "summary": "Why roles end, and how holders grow in them.", "body": "## Terms\nRoles are held for a set term, usually one year. Terms make it normal to check how a role is going, and give others a chance to step in.\n\n## Feedback\nBefore a term ends, the circle gives the role holder feedback: what is going well, and what would help them grow. Then it runs a new selection, which may select the same person again."}]};
async function addStarter(asExample){
  const cid = asExample ? 'kexbasics' : uid('k');

  return cid;
}

const fText = (id,label,v,o={}) => `<label class="f"><span>${label}</span><input id="${id}" value="${esc(v)}" ${o.list?'list="dl-people"':''} placeholder="${esc(o.ph||'')}" autocomplete="off">${o.hint?`<small>${o.hint}</small>`:''}</label>`;
const fArea = (id,label,v,o={}) => `<label class="f"><span>${label}</span><textarea id="${id}" rows="${o.rows||3}" placeholder="${esc(o.ph||'')}">${esc(v)}</textarea>${o.hint?`<small>${o.hint}</small>`:''}</label>`;
const fDate = (id,label,iso) => `<label class="f"><span>${label}</span><input id="${id}" class="date" value="${mdy(iso)}" placeholder="mm/dd/yyyy" inputmode="numeric" maxlength="10" autocomplete="off"></label>`;
const fSel = (id,label,map,v) => `<label class="f"><span>${label}</span><select id="${id}">${Object.entries(map).map(([k,l])=>`<option value="${k}" ${k===v?'selected':''}>${esc(l)}</option>`).join('')}</select></label>`;
const fChk = (id,label,on) => `<label class="chk"><input type="checkbox" id="${id}" ${on?'checked':''}> ${label}</label>`;
const gv = (id, root=document) => (root.querySelector('#'+id)?.value ?? '').trim();
const gc = (id, root=document) => !!root.querySelector('#'+id)?.checked;
class Invalid extends Error{}
function gd(id, root=document){ const el = root.querySelector('#'+id); if(!el) return ''; const r = parseMDY(el.value); if(!r.ok){ el.classList.add('bad'); el.focus(); throw new Invalid('Use the date format mm/dd/yyyy.'); } el.classList.remove('bad'); return r.iso; }
const lines = s => s.split('\n').map(x=>x.trim()).filter(Boolean);

function circleForm(c){

  const roleBlock = ([k,l,desc]) => { const r=c.roles?.[k]||{}; return `<div class="reprow"><div><b>${l}</b><div class="muted" style="font-size:12.5px">${desc}</div></div><div class="grid3">${fText('r-'+k,'Held by',r.holder,{list:1})}${fDate('rs-'+k,'Selected on',r.selected)}${fDate('rt-'+k,'Term ends',r.termEnd)}</div></div>`; };
  return `
  <div class="grid2">${fText('f-name','Circle name',c.name,{ph:'e.g. Membership Circle'})}${(() => { const taken = k => vals('circles').find(x => x.type===k && x.id!==c.id); return `<label class="f"><span>Type</span><select id="f-type">${Object.entries(CTYPES).map(([k,l]) => { const t = (k==='general'||k==='mission') && taken(k); return `<option value="${k}" ${k===(c.type||'department')?'selected':''} ${t?'disabled':''}>${esc(l)}${t?` (already ${esc(t.name)})`:''}</option>`; }).join('')}</select><small>One general circle and at most one mission circle per organization.</small></label>`; })()}</div>
  <label class="f"><span>Parent circle</span><select id="f-parent"><option value="">None (top of the structure)</option>${others.map(o=>`<option value="${o.id}" ${o.id===c.parentId?'selected':''}>${esc(o.name)}</option>`).join('')}</select><small>The circle this one is double-linked to.</small></label>
  ${fArea('f-aim','Aim',c.aim,{ph:'What this circle does or produces',hint:'One or two sentences.'})}
  ${fArea('f-domain','Domain',c.domain,{ph:'What this circle decides on its own',rows:3})}
  ${fArea('f-desc','More about this circle',c.description,{ph:'Background, how to reach the circle, links',rows:2})}
  ${fText('f-rhythm','Meeting rhythm',c.rhythm,{ph:'e.g. Every other Tuesday, 18:00'})}
  ${memberPicker(c.members)}
  <fieldset class="fs"><legend>Roles</legend><p class="hint">Leader and delegate apply when the circle has a parent circle.</p>${ROLE_KEYS.map(roleBlock).join('')}
    <div class="rep" id="xroles">${(c.extraRoles||[]).map(xRoleRow).join('')}</div>
    <div><button class="btn sm" data-act="addXRole" type="button">Add another role</button></div>
  </fieldset>`;
}
function xRoleRow(r={}){ const k=uid('x'); return `<div class="reprow xrole"><div class="rh"><b>Other role</b><button class="btn sm ghost" data-act="removeRow" type="button">Remove</button></div><div class="grid2">${fText('xt-'+k,'Role title',r.title,{ph:'e.g. Treasurer'})}${fText('xh-'+k,'Held by',r.holder,{list:1})}</div><div class="grid2">${fDate('xs-'+k,'Selected on',r.selected)}${fDate('xe-'+k,'Term ends',r.termEnd)}</div>${fText('xd-'+k,'Responsibilities',r.description)}</div>`; }
function editCircle(id, parentId){
  const c = id ? clone(S.circles[id]) : {id:uid('c'), type: parentId ? 'department' : (vals('circles').length ? 'department' : 'general'), parentId: parentId||'', roles:{}, members:[], backlog:[]};
  openModal(id ? 'Edit circle' : 'New circle', circleForm(c), async () => {
    const name = gv('f-name'); if(!name){ toast('Give the circle a name.'); $('#f-name').focus(); return false; }
    const ty = gv('f-type'), pa = gv('f-parent');
    if(ty==='general' || ty==='mission'){ const other = vals('circles').find(x => x.type===ty && x.id!==c.id); if(other){ toast(`${other.name} is already the ${CTYPES[ty].toLowerCase()}. An organization has only one.`); return false; } }
    if(ty==='mission' && pa){ toast('The mission circle sits at the top, so it has no parent circle.'); return false; }
    if(ty==='general' && pa && S.circles[pa]?.type!=='mission'){ toast('The general circle can only sit under the mission circle.'); return false; }
    const roles = {};
    ROLE_KEYS.forEach(([k]) => { roles[k] = {holder:gv('r-'+k), selected:gd('rs-'+k), termEnd:gd('rt-'+k)}; });
    const extraRoles = [...document.querySelectorAll('#xroles .xrole')].map(row => { const k=row.querySelector('input').id.slice(3); return {title:gv('xt-'+k), holder:gv('xh-'+k), selected:gd('xs-'+k), termEnd:gd('xe-'+k), description:gv('xd-'+k)}; }).filter(r=>r.title);
    const obj = {...c, name, type:gv('f-type'), parentId:gv('f-parent'), aim:gv('f-aim'), domain:gv('f-domain'), description:gv('f-desc'), rhythm:gv('f-rhythm'), members:pickedMembers(), roles, extraRoles, updated:todayISO()};
    obj.example = c.example || false;
    const ok = await put('circles', obj); if(ok){ toast(id?'Circle saved':'Circle created'); if(!id) location.hash = 'circle-'+obj.id; }
    return ok;
  }, {wide:true, saveLabel: id?'Save circle':'Create circle', onDelete: id ? async () => {
    if(childrenOf(id).length){ toast('Move or delete its sub-circles first.'); return false; }
    await remove('circles', id); location.hash = 'circles'; toast('Circle deleted'); return true;
  } : null, deleteLabel:'Delete circle'});
}

let curCircleForForm = null;
function editMeeting(id, circleId){
  const m = id ? clone(S.meetings[id]) : {id:uid('m'), circleId, date:todayISO(), status:'draft', agenda:[], present:[]};
  const c = S.circles[m.circleId] || {members:[]};
