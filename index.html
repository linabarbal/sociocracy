  const body = `
  <div class="grid3">${fDate('m-date','Meeting date',m.date)}${fText('m-fac','Facilitator',m.facilitator ?? c.roles?.facilitator?.holder,{list:1})}${fText('m-sec','Secretary',m.secretary ?? c.roles?.secretary?.holder,{list:1})}</div>
  <fieldset class="fs"><legend>1 · Opening round</legend><p class="hint">Each person checks in. Note anything the circle should keep in mind.</p>${fArea('m-open','Notes',m.opening,{rows:2})}</fieldset>
  <fieldset class="fs"><legend>2 · Administrative items</legend>
    <div class="f"><span>Present</span><div class="chks">${members.length?members.map((p,i)=>`<label class="chk"><input type="checkbox" class="m-pres" value="${esc(p)}" ${(id?(m.present||[]).includes(p):true)?'checked':''}> ${esc(p)}</label>`).join(''):'<span class="muted">Add members to the circle to tick attendance.</span>'}</div></div>
    ${fText('m-guests','Guests',guests.join(', '),{ph:'Names separated by commas'})}
    <div class="grid2">${fChk('m-prev','Minutes of the last meeting consented',m.prevMinutes)}${fDate('m-next','Next meeting',m.nextDate)}</div>
    ${fArea('m-ann','Announcements',m.announcements,{rows:2})}
  </fieldset>
  <fieldset class="fs"><legend>3 · Consent to the agenda</legend>${fChk('m-agc','The circle consented to the agenda',m.agendaConsented ?? true)}</fieldset>
  <fieldset class="fs"><legend>4 · Agenda items</legend><div class="rep" id="agrows">${(m.agenda||[]).map(agendaRow).join('')}</div><div><button class="btn sm" data-act="addAgenda" type="button">Add agenda item</button></div>
    ${(c.backlog||[]).length?`<div class="f"><span>Add from the backlog</span><div class="blchips">${c.backlog.map((b,i)=>`<button type="button" data-act="useBacklog" data-i="${i}">+ ${esc(bText(b))}</button>`).join('')}</div><small>Items you add here leave the backlog when you save.</small></div>`:''}</fieldset>
  <fieldset class="fs"><legend>5 · Closing round</legend><p class="hint">Meeting evaluation: what went well, what can improve.</p>${fArea('m-close','Notes',m.closing,{rows:2})}</fieldset>
  <fieldset class="fs"><legend>Action items</legend>${linked.length?`<p class="hint">Already linked: ${linked.map(a=>esc(a.task)).join(' · ')}. Manage them in the Work tab.</p>`:''}<div class="rep" id="narows"></div><div><button class="btn sm" data-act="addActionRow" type="button">Add action item</button></div></fieldset>
  <fieldset class="fs"><legend>Key takeaways for everyone</legend><p class="hint">The few points a person outside this circle should know. These appear on the overview and the community board.</p>${fArea('m-take','Takeaways',m.takeaways,{rows:4})}
    ${fSel('m-status','Status',{draft:'Draft (still being written)', published:'Final (minutes complete)'},m.status)}</fieldset>`;
  openModal(id ? 'Edit meeting minutes' : 'Record a meeting', body, async () => {
    const date = gd('m-date'); if(!date){ toast('Add the meeting date.'); return false; }
    const present = [...document.querySelectorAll('.m-pres:checked')].map(x=>x.value).concat(gv('m-guests').split(',').map(s=>s.trim()).filter(Boolean));
    const absent = members.filter(p=>!present.includes(p));
    const agenda = [...document.querySelectorAll('#agrows .agrow')].map(row => { const k=row.dataset.k; return {title:gv('at-'+k), type:gv('ay-'+k), notes:gv('an-'+k), outcome:gv('ao-'+k), takeaway:gv('ak-'+k), proposalId:gv('ap-'+k), share:gc('as-'+k), noticeId:row.dataset.shared||'', sentTo:(row.dataset.sent||'').split(',').filter(Boolean)}; }).filter(a=>a.title||a.notes||a.outcome);
    const usedBacklog = [...document.querySelectorAll('#agrows .agrow')].map(r=>r.dataset.bl).filter(v=>v!=='').map(Number);
    const newActs = [...document.querySelectorAll('#narows .narow')].map(row => { const k=row.dataset.k; return {task:gv('nt-'+k), owner:gv('no-'+k), due:gd('nd-'+k)}; }).filter(a=>a.task);
    const obj = {...m, date, facilitator:gv('m-fac'), secretary:gv('m-sec'), opening:gv('m-open'), present, absent, prevMinutes:gc('m-prev'), nextDate:gd('m-next'), announcements:gv('m-ann'), agendaConsented:gc('m-agc'), agenda, closing:gv('m-close'), takeaways:gv('m-take'), status:gv('m-status')};
    for(const a of agenda){
      if(a.share && !a.noticeId){
        const kind = a.type==='decide'?'decision':a.type==='select'?'role':a.type==='review'?'policy':'news';
        const n = {id:uid('n'), title:a.title, body:[a.outcome, a.takeaway].filter(Boolean).join('\n\n'), kind, circleId:m.circleId, date, meetingId:obj.id, proposalId:a.proposalId||'', affectsAll:false, example:!!m.example};
        if(await put('notices', n)) a.noticeId = n.id;
      }
      delete a.share;
    }
    const ok = await put('meetings', obj);
    if(ok && usedBacklog.length && S.circles[m.circleId]){ const cc = clone(S.circles[m.circleId]); cc.backlog = (cc.backlog||[]).filter((_,i)=>!usedBacklog.includes(i)); await put('circles', cc); }
    if(ok){ for(const a of newActs){ await put('actions', {id:uid('t'), circleId:m.circleId, meetingId:obj.id, status:'todo', ...a, example:!!m.example}); } toast('Minutes saved'); location.hash = 'meeting-'+obj.id; }
    return ok;
  }, {wide:true, saveLabel:'Save minutes', onDelete: id ? async () => { await remove('meetings', id); location.hash='circle-'+m.circleId+'-meetings'; toast('Meeting deleted'); return true; } : null, deleteLabel:'Delete minutes'});
}

/* ---------- Proposal form ---------- */
function objRow(o={}){ const k=uid('o'); return `<div class="reprow orow" data-k="${k}"><div class="rh"><b>Objection</b><button class="btn sm ghost" data-act="removeRow" type="button">Remove</button></div><div class="grid2">${fText('ob-'+k,'Raised by',o.by,{list:1})}<div class="f"><span>Status</span>${fChk('or-'+k,'Integrated',o.resolved)}</div></div>${fArea('oc-'+k,'Objection',o.concern,{rows:2,ph:'How would this proposal prevent the circle from reaching its aim?'})}${fArea('os-'+k,'How it was integrated',o.resolution,{rows:2})}</div>`; }
function editProposal(id, circleId){
  const p = id ? clone(S.proposals[id]) : {id:uid('p'), circleId, stage:'forming', created:todayISO(), objections:[]};
  const meets = circleMeetings(p.circleId);
  const body = `
  ${fText('p-title','Title',p.title,{ph:'e.g. Shared calendar for all circles'})}
  <div class="grid2">${fText('p-author','Brought by',p.author,{list:1})}${fSel('p-stage','Stage',Object.fromEntries(Object.entries(STAGES).map(([k,v])=>[k,v.label])),p.stage)}</div>
  <fieldset class="fs"><legend>Forming the proposal</legend>
    ${fArea('p-driver','The need (driver)',p.driver,{rows:2,ph:'What is happening, and what is needed?'})}
    ${fArea('p-und','Understand',p.understanding,{rows:2,ph:'What the circle learned from its questions'})}
    ${fArea('p-dim','Explore dimensions',p.dimensions,{rows:2,ph:'Aspects any good proposal must address'})}
    ${fArea('p-ideas','Ideas',p.ideas,{rows:2})}
  </fieldset>
  ${fArea('p-text','The proposal',p.proposal,{rows:5,ph:'Who does what, by when, and how it will be evaluated'})}
  <fieldset class="fs"><legend>Consent process</legend>
    ${fArea('p-q','Clarifying questions',p.questions,{rows:2})}
    ${fArea('p-r','Quick reactions',p.reactions,{rows:2})}
    <div class="rep" id="orows">${(p.objections||[]).map(objRow).join('')}</div><div><button class="btn sm" data-act="addObjection" type="button">Add objection</button></div>
    <div class="grid3">${fDate('p-dec','Consented on',p.decided)}${fDate('p-rev','Review by',p.reviewDate)}<label class="f"><span>Decided in meeting</span><select id="p-meet"><option value="">None</option>${meets.map(m=>`<option value="${m.id}" ${m.id===p.meetingId?'selected':''}>${mdy(m.date)}</option>`).join('')}</select></label></div>
    ${p.noticeId?'<p class="hint">Announced on the community board.</p>':`<div class="grid2">${fChk('p-ann','When consented, announce on the community board',true)}${fChk('p-all','It affects everyone',false)}</div>`}
  </fieldset>
  <fieldset class="fs"><legend>If it is not consented</legend>
    <p class="hint">Set the stage to <b>Not consented</b> when an objection cannot be integrated. Record why, so the same idea does not come back without this context.</p>
    <div class="grid2">${fDate('p-drop','Not consented on',p.droppedOn)}<div class="f"><span>Community board</span>${p.dropNoticeId?'<span class="muted" style="font-size:13.5px">Already posted.</span>':fChk('p-dropann','Let the community know',false)}</div></div>
    ${fArea('p-why','Why it was not consented',p.dropReason,{rows:3,ph:'The objection that could not be integrated, and what the circle learned'})}
  </fieldset>`;
  openModal(id ? 'Update proposal' : 'New proposal', body, async () => {
    const title = gv('p-title'); if(!title){ toast('Give the proposal a title.'); return false; }
    const objections = [...document.querySelectorAll('#orows .orow')].map(r=>{ const k=r.dataset.k; return {by:gv('ob-'+k), concern:gv('oc-'+k), resolution:gv('os-'+k), resolved:gc('or-'+k)}; }).filter(o=>o.concern);
    const obj = {...p, title, author:gv('p-author'), stage:gv('p-stage'), driver:gv('p-driver'), understanding:gv('p-und'), dimensions:gv('p-dim'), ideas:gv('p-ideas'), proposal:gv('p-text'), questions:gv('p-q'), reactions:gv('p-r'), objections, decided:gd('p-dec'), reviewDate:gd('p-rev'), meetingId:gv('p-meet')};
    obj.droppedOn = gd('p-drop'); obj.dropReason = gv('p-why');
    if(obj.stage==='notconsented'){
      const open = objections.filter(o=>!o.resolved);
      if(!obj.dropReason && open.length) obj.dropReason = open.map(o=>o.concern).join('\n');
      if(!obj.dropReason) throw new Invalid('Add the objection that could not be integrated, or explain why it was not consented.');
      if(!obj.droppedOn) obj.droppedOn = todayISO();
      if(!obj.dropNoticeId && gc('p-dropann')){
        const n = {id:uid('n'), title:'Not consented: '+title, kind:'news', circleId:obj.circleId, date:obj.droppedOn, proposalId:obj.id, meetingId:obj.meetingId, affectsAll:false, example:!!p.example, body:`${circleName(obj.circleId)} did not consent to this proposal. The current way stays in place.\n\nWhy: ${obj.dropReason}`};
        if(await put('notices', n)) obj.dropNoticeId = n.id;
      }
    }
    if(obj.stage==='consented' && !obj.decided) obj.decided = todayISO();
    if(obj.stage==='consented' && !obj.noticeId && gc('p-ann')){
      const n = {id:uid('n'), title:'Consented: '+title, body:[obj.proposal, obj.reviewDate?'Review by '+mdy(obj.reviewDate)+'.':''].filter(Boolean).join('\n\n'), kind:'decision', circleId:obj.circleId, date:obj.decided, effective:obj.decided, proposalId:obj.id, meetingId:obj.meetingId, affectsAll:gc('p-all'), example:!!p.example};
      if(await put('notices', n)) obj.noticeId = n.id;
    }
    const ok = await put('proposals', obj); if(ok){ toast('Proposal saved'); location.hash='proposal-'+obj.id; } return ok;
  }, {wide:true, saveLabel:'Save proposal', onDelete: id ? async () => { await remove('proposals', id); location.hash='circle-'+p.circleId+'-proposals'; toast('Proposal deleted'); return true; } : null, deleteLabel:'Delete proposal'});
}

function settings(){
  const org = S.org.main || {};
  const body = `
  <fieldset class="fs"><legend>Name and logo</legend>
    <div class="photo-row"><span id="lg-wrap" class="logo-prev">${org.logo ? `<img src="${esc(org.logo)}" alt="">` : DEFAULT_LOGO}</span>

    <label class="chk vis"><input type="radio" name="vis" id="vis-private" value="private" ${visibility!=='public'?'checked':''}><span><b>Private</b><br><span class="muted">Only invited people who sign in can see anything.</span></span></label>
    <label class="chk vis"><input type="radio" name="vis" id="vis-public" value="public" ${visibility==='public'?'checked':''}><span><b>Public, read-only</b><br><span class="muted">Anyone with the link can read circles, people, minutes, proposals, the board and the wiki. Only invited people can sign in and edit. Contact details stay private.</span></span></label>
    <p class="hint">Before you make it public, check that your members agree to their names, roles and minutes being visible to anyone.</p>
  </fieldset>` : ''}
  <fieldset class="fs"><legend>Where the data lives</legend><p class="hint">${mode==='supabase'?'Data is stored in your own Supabase database. Only invited people can sign in, and the database rules decide what each person can do.':mode==='shared'?'Data is shared: everyone who opens this page sees the same circles and records, and changes appear live.':'Data is saved in this browser only. To share it, open the published page on claude.ai or connect your own database.'}</p></fieldset>
  <fieldset class="fs"><legend>Export or import</legend><p class="hint">Use this to back up your data or move it to your own hosted version.</p>
    <textarea id="s-json" rows="6" style="font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px;width:100%" placeholder="Paste exported data here to import it"></textarea>
    <div class="row"><button class="btn sm" data-act="exportData" type="button">Show and copy all data</button><button class="btn sm w" data-act="importData" type="button">Import pasted data</button></div></fieldset>
  <fieldset class="fs w"><legend>Example data</legend><div class="row"><button class="btn sm" data-act="loadExamples" type="button">Load example organization</button><button class="btn sm" data-act="removeExamples" type="button">Remove example data</button></div></fieldset>`;
  curLogo = org.logo || '';
  const orgLocked = mode === 'supabase' && !isAdmin;
  openModal('Data & settings', body, canWrite && !orgLocked ? async () => {
    const ok = await put('org', {...org, id:'main', name:gv('s-name'), subtitle:$('#s-sub').value.trim(), tagline:gv('s-tag'), logo:curLogo||''});
    if(!ok) return false;
    const vSel = document.querySelector('input[name="vis"]:checked');
    if(mode === 'supabase' && isAdmin && vSel && vSel.value !== visibility){
      const {error} = await sb.from('settings').upsert({key:'visibility', value:vSel.value});
      if(error){ toast('Could not change who can see the workspace. Make sure setup.sql is up to date.'); return false; }
      visibility = vSel.value; toast(visibility === 'public' ? 'The workspace is now public and read-only for guests' : 'The workspace is now private'); return true;
    }
    toast('Settings saved'); return true; } : null, {wide:true});
}
async function importData(){
  let d; try{ d = JSON.parse($('#s-json').value); }catch(e){ toast('That is not valid exported data.'); return; }
  if(!d || !['sociocracy','circle-commons'].includes(d.format)){ toast('That is not exported Sociocracy data.'); return; }
  let n = 0; for(const c of COLS){ for(const doc of (d[c]||[])){ if(doc && doc.id){ await put(c, doc); n++; } } }
  toast(`Imported ${n} records`); closeModal();
}

  const wikis = [
    {id:'wexstart', title:'Start here: welcome to the community', category:'onboarding', circleId:'cexmem', pinned:true, updated:d(-5), updatedBy:'Priya (example)', reviewDate:d(170), summary:'What to read and who to talk to in your first weeks.', body:`## Welcome\n\nWe organize ourselves in **circles**. Each circle has an aim, a domain where it decides, and four core roles. You can see all of them on the circle map.\n\n## Your first weeks\n\n1. Read our [[Community agreements]].\n2. Pick one or two circles that interest you and ask to sit in on a meeting.\n3. Meet your buddy from the Welcome Team.\n4. Read [[How to bring a proposal]] when you have an idea.\n\n## Who to ask\n\n> Not sure where something belongs? Use **Who decides?** to search every circle's domain.\n\nThe Membership Circle looks after this page.`, revisions:[], ...ex},
    {id:'wexagree', title:'Community agreements', category:'agreements', circleId:'cexgen', pinned:true, updated:d(-40), updatedBy:'Jo (example)', reviewDate:d(140), summary:'How we treat each other and make decisions together.', body:`## How we make decisions\n\n- We decide by **consent**: a decision passes when nobody has an objection.\n- An objection explains how a proposal would get in the way of a circle's aim.\n- Decisions are made by the circle whose domain covers the topic.\n\n## How we meet\n\n- We start with an opening round and end with a closing round.\n- We speak in rounds so every voice is heard.\n- Minutes are shared with key takeaways for everyone.\n\n## How we treat each other\n\n- Assume good intent and ask before assuming.\n- Raise tensions early, in the circle where they belong.\n- Everyone can object to an existing policy and put it back on the agenda.`, revisions:[{title:'Community agreements', body:'## How we make decisions\n\n- We decide by consent.', date:d(-120), by:'Ana (example)', note:'First version'}], ...ex},
    {id:'wexprop', title:'How to bring a proposal', category:'howto', circleId:'cexgen', updated:d(-20), updatedBy:'Marc (example)', reviewDate:d(160), summary:'From an idea to a consented decision.', body:`## 1. Find the right circle\n\nSearch **Who decides?** for the circle whose domain covers your topic.\n\n## 2. Describe the need\n\nWrite down what is happening and what is needed. Ask the circle's secretary to add it to the backlog.\n\n## 3. Shape it together\n\nThe circle explores the need and shapes a proposal with you.\n\n## 4. Consent\n\nThe circle runs the consent process. If an objection cannot be integrated, the proposal is not consented and the current way stays in place.`, revisions:[], ...ex},
    {id:'wexcal', title:'One shared calendar for all circles', category:'policies', circleId:'cexops', proposalId:'pexcal', updated:d(-9), updatedBy:'Kai (example)', reviewDate:d(80), summary:'Every circle keeps its meetings and room bookings in one calendar.', body:`## What we agreed\n\nAll circles add their meetings and room bookings to one shared calendar that every member can view. Circle secretaries keep their circle's events up to date.\n\n## Booking the room\n\n1. Open the shared calendar.\n2. Check the room is free.\n3. Add an event named *Room: your circle*.\n\n---\n\nConsented by Operations Circle. Review in three months.`, revisions:[], ...ex},
    {id:"wexmeet", title:"Meeting agreements", category:"agreements", circleId:"cexgen", pinned:false, updated:d(-30), updatedBy:"Marc (example)", reviewDate:d(150), summary:"How we behave in circle meetings so every voice is heard.", body:"## Before the meeting\n- The secretary shares the agenda at least three days ahead.\n- Read proposals before you arrive.\n- If you cannot attend, tell the secretary and share any input in writing.\n\n## During the meeting\n- We speak in **rounds**. Wait for your turn, and keep your contribution short.\n- The facilitator holds the format. Anyone can ask for a pause or a clarification.\n- Phones away unless you are taking minutes.\n- We start and end on time.\n\n## After the meeting\n- The secretary shares draft minutes within two days.\n- Key takeaways are written for people outside the circle.\n- Action items have one responsible person and a due date.\n\n> If a meeting regularly runs over time, raise it in the closing round.", revisions:[], ...ex},
    {id:"wexcomm", title:"Communication agreements", category:"agreements", circleId:"cexmem", pinned:false, updated:d(-55), updatedBy:"Lena (example)", reviewDate:d(125), summary:"Which channel to use, and how quickly we reply.", body:"## Channels\n- **Community board**: decisions and changes that affect people outside one circle.\n- **Circle workspace**: minutes, proposals and tasks for a circle.\n- **Direct messages**: personal or quick practical questions only.\n\n## Response times\n- Questions to a circle: an answer or an acknowledgement within one week.\n- Urgent safety issues: call the Operations leader directly.\n\n## Writing for everyone\n- Lead with what changed and what it means for people.\n- Name the circle that decided and link to the decision.\n- Avoid abbreviations that newcomers will not know. See the [[Glossary]].", revisions:[], ...ex},
    {id:"wexconf", title:"Feedback and tensions", category:"agreements", circleId:"cexgen", pinned:false, updated:d(-90), updatedBy:"Ana (example)", reviewDate:d(-10), summary:"What to do when something is not working, between people or in a process.", body:"## Raise it early\nA tension is a gap between how things are and how they could be. Small tensions are easier to resolve than large ones.\n\n## Where it belongs\n1. If it is about a process or decision, bring it to the circle whose domain covers it. Use **Who decides?** to find that circle.\n2. If it is between two people, talk to the person first.\n3. If that does not help, ask a facilitator you both trust to hold a conversation.\n\n## Feedback for role holders\nAt the end of each term, the circle gives the role holder feedback before running a new selection. We focus on what helps the person grow in the role.", revisions:[], ...ex},
    {id:"wexspend", title:"Spending policy", category:"policies", circleId:"cexgen", pinned:false, updated:d(-70), updatedBy:"Sam (example)", reviewDate:d(20), summary:"Who can spend how much, and how it is recorded.", body:"## Limits\n- Up to **100 per item**: any circle member, within the circle's budget.\n- **100 to 500**: consent of the circle in a meeting, recorded in the minutes.\n- **Over 500**: consent of the General Circle.\n\n## Recording\nEvery expense is added to the shared spending sheet within one week, with the circle name and a link to the minutes where relevant.\n\n---\n\nConsented by General Circle. Review due soon.", revisions:[], ...ex},
    {id:"wexterms", title:"Role terms and selections", category:"policies", circleId:"cexgen", pinned:false, updated:d(-100), updatedBy:"Jo (example)", reviewDate:d(265), summary:"How long roles last and how we select people.", body:"## Terms\n- Leader, delegate, facilitator and secretary terms are **one year** by default.\n- A circle can choose a shorter term when it selects someone.\n- One person should not hold more than two roles in the same circle.\n\n## Selection\nAll roles are filled with the selection process. See [[How to run a selection]].\n\n## When a term ends\nThe secretary adds the role to the backlog at least one meeting before the term ends.", revisions:[], ...ex},
    {id:"wexreview", title:"Reviewing policies", category:"policies", circleId:"cexgen", pinned:false, updated:d(-60), updatedBy:"Marc (example)", reviewDate:d(305), summary:"Every policy has a review date. This is how we review.", body:"## Why we review\nA policy that was good enough for now may not be good enough later. Review dates make sure we check.\n\n## How\n1. The secretary adds the policy to the backlog before its review date.\n2. In the meeting, the circle shares what worked and what did not in a round.\n3. The circle consents to keep it, change it, or end it, and sets the next review date.\n4. If the policy changes, update its wiki page and post on the community board.", revisions:[], ...ex},
    {id:"wexobj", title:"How to raise an objection", category:"howto", circleId:"cexgen", pinned:false, updated:d(-25), updatedBy:"Kai (example)", reviewDate:d(155), summary:"Objections make proposals better. Here is how to raise one well.", body:"## Is it an objection?\nAsk yourself: *would this proposal get in the way of the circle reaching its aim?* If yes, it is an objection. If you simply prefer something else, it is a concern you can share in the quick reactions round.\n\n## How to say it\n- Say **objection** in the consent round.\n- Explain how the proposal would harm the aim.\n- If you can, suggest what would resolve it.\n\n## What happens next\nThe circle works to integrate your objection, often by changing the proposal, shortening a trial, or adding a review date. If it cannot be integrated, the proposal is not consented and the current way stays in place.", revisions:[], ...ex},
    {id:"wexsel", title:"How to run a selection", category:"howto", circleId:"cexmem", pinned:false, updated:d(-15), updatedBy:"Priya (example)", reviewDate:d(165), summary:"Step-by-step guide for facilitators.", body:"## Prepare\n- Agree on the role description: responsibilities, qualifications and term.\n- In the app, open the circle and choose **Start selection** on the role.\n\n## Run it\n1. Everyone writes a nomination without talking.\n2. **Nomination round**: each person names their nominee and says why.\n3. **Change round**: anyone may change their nomination after hearing the reasons.\n4. The facilitator proposes a candidate based on the reasons.\n5. **Consent round**, with the candidate last.\n\n## Finish\nChoose **Complete selection** in the app. The role, term and description update, and a role change is posted to the community board.", revisions:[], ...ex},
    {id:"wexmin", title:"How to take minutes", category:"howto", circleId:"cexops", pinned:false, updated:d(-35), updatedBy:"Jo (example)", reviewDate:d(145), summary:"For secretaries: what to record and how to share it.", body:"## Record each step\n1. Opening round: anything the circle should keep in mind.\n2. Administrative items: who is present, last minutes, next meeting date.\n3. Consent to the agenda.\n4. Agenda items: notes, outcome and one key point for the community.\n5. Closing round: what went well and what can improve.\n\n## Key takeaways\nWrite two or three sentences for someone **outside** the circle. What was decided? What changes for them?\n\n## Share\nSet the status to **Final** when the minutes are complete. Tick *Post this outcome to the community board* for decisions that affect others.", revisions:[], ...ex},
    {id:"wexroom", title:"How to book the shared space", category:"howto", circleId:"cexops", pinned:false, updated:d(-8), updatedBy:"Kai (example)", reviewDate:d(172), summary:"Check the calendar, add your booking, leave the room ready.", body:"## Book\n1. Open the shared calendar. See [[One shared calendar for all circles]].\n2. Check that the room is free.\n3. Add an event named *Room: your circle or name*.\n\n## Use\n- Leave the room as you found it.\n- Report anything broken as a task for the Operations Circle.\n\n> Recurring bookings need the consent of the Operations Circle.", revisions:[], ...ex},
    {id:"wexmonth", title:"Your first month", category:"onboarding", circleId:"cexwel", pinned:true, updated:d(-12), updatedBy:"Ruth (example)", reviewDate:d(168), summary:"A checklist for new members.", body:"## Week 1\n- Meet your buddy.\n- Read [[Start here: welcome to the community]] and the [[Community agreements]].\n\n## Week 2\n- Look at the circle map and choose one or two circles to visit.\n- Ask the secretary of each circle when it next meets.\n\n## Week 3\n- Sit in on a circle meeting as a guest.\n- Read [[How to bring a proposal]].\n\n## Week 4\n- Talk with your buddy about which circle you would like to join.\n- Ask that circle to consent to you joining as a member.", revisions:[], ...ex},
    {id:"wexjoin", title:"Joining a circle", category:"onboarding", circleId:"cexmem", pinned:false, updated:d(-45), updatedBy:"Tomas (example)", reviewDate:d(135), summary:"How membership in a circle works.", body:"## Who can join\nAny community member can ask to join a circle. The circle consents to new members, to make sure it stays able to reach its aim.\n\n## How\n1. Attend at least one meeting as a guest.\n2. Ask the circle's leader or secretary to add your request to the agenda.\n3. The circle runs a consent round on your membership.\n\n## Leaving\nYou can leave a circle at any time. Let the secretary know so they can update the member list and reassign your tasks.", revisions:[], ...ex},
    {id:"wexgloss", title:"Glossary", category:"reference", circleId:"cexgen", pinned:false, updated:d(-50), updatedBy:"Ana (example)", reviewDate:d(130), summary:"Words we use, in plain language.", body:"## Circles\n- **Circle**: a group with a shared aim and a domain where it decides.\n- **Aim**: what a circle does or produces.\n- **Domain**: the area where a circle makes its own decisions.\n- **Double link**: the leader and delegate who connect a circle to its parent circle.\n\n## Decisions\n- **Consent**: a decision passes when nobody has an objection.\n- **Objection**: a reasoned argument that a proposal would harm the circle's aim.\n- **Range of tolerance**: what is good enough for now and safe enough to try.\n- **Policy**: a decision that guides future work, kept in a circle's logbook.\n\n## Meetings\n- **Round**: everyone speaks in turn, one at a time.\n- **Backlog**: topics waiting for a future agenda.\n- **Logbook**: a circle's record of policies and decisions.", revisions:[], ...ex},
    {id:"wexformat", title:"Meeting format at a glance", category:"reference", circleId:"cexgen", pinned:false, updated:d(-50), updatedBy:"Marc (example)", reviewDate:d(130), summary:"The five steps every circle meeting follows.", body:"1. **Opening round**: check in.\n2. **Administrative items**: attendance, last minutes, next meeting, announcements.\n3. **Consent to the agenda**.\n4. **Agenda items**: reports, explorations, proposals, selections and policy reviews.\n5. **Closing round**: evaluate the meeting.\n\n> The facilitator holds the format. The secretary records the minutes and the key takeaways.", revisions:[], ...ex}

  const courses = [
    {id:'kexwelcome', title:'Welcome to the community', summary:'Everything a new member needs in their first month, in the order you need it.', description:'This course is for new members and anyone who wants a refresher. It explains how we organize ourselves in circles, how meetings and decisions work, and how to find your place.', outcomes:'How circles, aims and domains work\nWhat to do in your first month\nHow to join a circle\nHow our meetings run\nHow to bring a proposal\nHow to raise an objection well', circleId:'cexmem', order:1, modules:[{id:'m1', title:'Getting started'},{id:'m2', title:'How decisions are made'}], ...ex},

  wikis.push(
    {id:'wexconsent', title:'Running a consent round', category:'howto', courseId:'kexroles', moduleId:'m1', order:1, circleId:'cexlrn', updated:d(-6), updatedBy:'Yuki (example)', reviewDate:d(180), summary:'How to guide a circle from a proposal to a decision.', revisions:[], ...ex, body:'## Before you start\n\nMake sure everyone has read the proposal. Remind the circle of its aim: objections are about the aim, not about preferences.\n\n## The rounds\n\n1. **Present** the proposal, or ask its author to.\n2. **Clarifying questions**: questions only. Answer briefly.\n3. **Quick reactions**: one short reaction each.\n4. **Consent round**: each person says *consent* or *objection*.\n\n## When someone objects\n\n- Thank them. An objection is information.\n- Ask how the proposal would harm the aim.\n- Invite ideas to integrate it, then run the consent round again on the amended proposal.\n\n> If an objection cannot be integrated, the proposal is not consented and the current way stays in place.'},
    {id:'wextake', title:'Writing key takeaways', category:'howto', courseId:'kexroles', moduleId:'m2', order:2, circleId:'cexlrn', updated:d(-6), updatedBy:'Omar (example)', reviewDate:d(180), summary:'Two or three sentences that keep the whole community informed.', revisions:[], ...ex, body:'## Who they are for\n\nKey takeaways are read by people **outside** your circle. Write for someone who was not in the room.\n\n## What to include\n\n- What was decided, and what changes for people.\n- What the circle is exploring, so others can share input.\n- Where to read more.\n\n## Example\n\n> We consented to one shared calendar for all circles. From next week, secretaries add their circle meetings there.'},
    {id:'wexleader', title:'What a leader does', category:'howto', courseId:'kexroles', moduleId:'m3', order:1, circleId:'cexlrn', updated:d(-6), updatedBy:'Priya (example)', reviewDate:d(180), summary:'The link from the parent circle into your circle.', revisions:[], ...ex, body:'## The role\n\nThe leader is selected by the **parent circle**. They keep the overview of the circle\'s work and make sure it moves forward.\n\n## In practice\n\n- Prepare agendas with the facilitator and secretary.\n- Bring relevant decisions from the parent circle into the circle.\n- Make day-to-day calls within the policies the circle has consented to.\n\nA leader does not decide alone what the circle should decide together.'},

/* ============ Wiki ============ */
const WCATS = {agreements:'Community agreements', policies:'Policies', howto:'How-tos', onboarding:'Onboarding', reference:'Reference'};
let wikiQ = '';
const slug = s => String(s).toLowerCase().replace(/<[^>]+>/g,'').replace(/&[a-z]+;/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40);
function wikiByTitle(t){ t = String(t).trim().toLowerCase(); return vals('wiki').find(w => (w.title||'').trim().toLowerCase() === t); }
function inlineMd(raw){
  // Split out [[wiki links]] before escaping so titles compare as typed
  return String(raw).split(/(\[\[[^\]]+\]\])/).map((part, i) => {
    if(i % 2){ const t = part.slice(2,-2); const w = wikiByTitle(t); return w ? `<a href="#wiki-${w.id}">${esc(t)}</a>` : `<span class="missing" title="No wiki page with this title yet">${esc(t)}</span>`; }
    let s = esc(part);
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^*\w])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>');
    s = s.replace(/\[([^\]]+)\]\(((?:https?:\/\/|#)[^\s)]+)\)/g, (m, txt, url) => `<a href="${url}"${url.startsWith('#')?'':' target="_blank" rel="noopener"'}>${txt}</a>`);
    return s;
  }).join('');
}
function md(src){
  const out = [], toc = []; let list = null, para = [], quote = [];
  const flushP = () => { if(para.length){ out.push(`<p>${inlineMd(para.join(' '))}</p>`); para = []; } };
  const flushL = () => { if(list){ out.push(`<${list.t}>${list.items.map(x => `<li>${inlineMd(x)}</li>`).join('')}</${list.t}>`); list = null; } };
  const flushQ = () => { if(quote.length){ out.push(`<blockquote>${inlineMd(quote.join(' '))}</blockquote>`); quote = []; } };
  const flush = () => { flushP(); flushL(); flushQ(); };
  String(src||'').replace(/\r/g,'').split('\n').forEach(line => {
    let m;
    if((m = line.match(/^(#{1,3})\s+(.*)$/))){ flush(); const lvl = m[1].length === 3 ? 3 : 2; const id = 'h-' + slug(m[2]) + '-' + out.length; if(lvl <= 3) toc.push({lvl, id, text:m[2]}); out.push(`<h${lvl} id="${id}">${inlineMd(m[2])}</h${lvl}>`); }
    else if((m = line.match(/^\s*[-*]\s+(.*)$/))){ flushP(); flushQ(); if(!list || list.t !== 'ul'){ flushL(); list = {t:'ul', items:[]}; } list.items.push(m[1]); }
    else if((m = line.match(/^\s*\d+[.)]\s+(.*)$/))){ flushP(); flushQ(); if(!list || list.t !== 'ol'){ flushL(); list = {t:'ol', items:[]}; } list.items.push(m[1]); }
    else if((m = line.match(/^>\s?(.*)$/))){ flushP(); flushL(); quote.push(m[1]); }
    else if(/^\s*-{3,}\s*$/.test(line)){ flush(); out.push('<hr>'); }
    else if(!line.trim()) flush();
    else { flushL(); flushQ(); para.push(line.trim()); }
  });
  flush();
  return {html: out.join(''), toc};
}
/* ---------- Academy: courses made of modules and lessons ---------- */
const readMins = t => Math.max(1, Math.round(String(t||'').split(/\s+/).filter(Boolean).length / 200));
const fmtMins = m => m < 60 ? `${m} min` : `${Math.floor(m/60)}h ${m%60 ? (m%60)+'m' : ''}`.trim();
const openMods = new Set();
function courseModules(cid){
  const c = S.courses[cid]; if(!c) return [];
  const mods = (c.modules||[]).map(m => ({...m}));
  const known = new Set(mods.map(m => m.id));
  if(vals('wiki').some(w => w.courseId === cid && !known.has(w.moduleId))) mods.push({id:'_more', title:'More lessons'});
  return mods.map((m, mi) => {
    const lessons = vals('wiki').filter(w => w.courseId === cid && (m.id === '_more' ? !known.has(w.moduleId) : w.moduleId === m.id))
      .sort((a,b) => (a.order ?? 0) - (b.order ?? 0) || (a.title||'').localeCompare(b.title||''))
      .map((w, li) => ({w, num:`${mi+1}.${li+1}`, mins:readMins(w.body)}));
    return {...m, n:mi+1, lessons, mins:lessons.reduce((s,l) => s + l.mins, 0)};
  });
}
function courseFlat(cid){ return courseModules(cid).flatMap(m => m.lessons.map(l => ({...l, m}))); }
function courseCard(c){
  const mods = courseModules(c.id), flat = mods.flatMap(m => m.lessons), mins = flat.reduce((s,l) => s + l.mins, 0);
  return `<a class="course-card" href="#course-${c.id}">
    <span class="eyebrow">Course · ${mods.length} module${mods.length===1?'':'s'}</span>
    <h3>${esc(c.title)}</h3>
    ${c.summary?`<p class="muted">${esc(c.summary)}</p>`:''}
    <div class="cc-meta"><span><b>${flat.length}</b> lesson${flat.length===1?'':'s'}</span><span><b>${fmtMins(mins)}</b> reading</span></div>
    ${c.circleId&&S.circles[c.circleId]?`<span class="bl-meta">Looked after by ${esc(S.circles[c.circleId].name)}</span>`:''}
  </a>`;
}
function wikiItem(w){
  const c = w.courseId && S.courses[w.courseId];
  const where = c ? (() => { const l = courseFlat(c.id).find(x => x.w.id === w.id); return `Lesson ${l?l.num:''} · ${esc(c.title)}`; })() : esc(WCATS[w.category]||'Library');
  return `<div class="item"><div class="body"><a class="ttl" href="#wiki-${w.id}">${esc(w.title)}</a>${w.summary?`<div class="muted clamp" style="font-size:13.5px">${esc(w.summary)}</div>`:''}<span class="bl-meta">${where} · ${readMins(w.body)} min read</span></div>${w.reviewDate && daysUntil(w.reviewDate) < 0 ? `<div class="side">${stChip('Review due','warn')}</div>` : ''}</div>`;
}
function libItem(w){ return `<div class="item"><div class="body"><a class="ttl" href="#wiki-${w.id}">${esc(w.title)}</a>${w.summary?`<div class="muted clamp" style="font-size:13.5px">${esc(w.summary)}</div>`:''}<span class="bl-meta">${w.circleId&&S.circles[w.circleId]?esc(S.circles[w.circleId].name)+' · ':''}${readMins(w.body)} min read</span></div>${w.reviewDate && daysUntil(w.reviewDate) < 0 ? `<div class="side">${stChip('Review due','warn')}</div>` : ''}</div>`; }
function wikiLists(){

async function lessonMove(id, dir){
  const w = S.wiki[id]; if(!w) return;
  const list = vals('wiki').filter(x => x.courseId === w.courseId && x.moduleId === w.moduleId).sort((a,b) => (a.order ?? 0) - (b.order ?? 0) || (a.title||'').localeCompare(b.title||''));
  const i = list.findIndex(x => x.id === id), j = i + dir; if(j < 0 || j >= list.length) return;
  [list[i], list[j]] = [list[j], list[i]];
  for(let k = 0; k < list.length; k++){ if(list[k].order !== k + 1) await put('wiki', {...clone(list[k]), order:k + 1}); }
}

function wikiHistory(id){

function appName(){ return (S.org.main||{}).name || (window.CC_CONFIG||{}).appName || 'Sociocracy'; }
function showGate(inner){
  const g = $('#gate');
  g.innerHTML = `<div class="gate-card"><div class="brand"><span class="brand-logo">${DEFAULT_LOGO}</span><div><b>${esc(appName())}</b><span>Shared governance workspace</span></div></div>${inner}</div>`;
  g.hidden = false; $('#app').hidden = true;
}
function hideGate(){ $('#gate').hidden = true; $('#app').hidden = false; }
function showSignIn(msg){
  showGate(`<h1>Sign in</h1><p class="muted">Enter your email and we will send you a sign-in link. No password needed.</p>
    <form id="signin" class="stack" data-form="signin"><label class="f"><span>Email</span><input id="si-email" type="email" autocomplete="email" required placeholder="you@example.org"></label><button class="btn pri" type="submit">Send sign-in link</button></form>
    ${msg ? `<p class="gate-msg">${msg}</p>` : ''}<p class="bl-meta">${visibility === 'public' ? 'Anyone can read this workspace. Only invited people can sign in to edit it.' : 'Only people an admin has invited can see this workspace.'}</p>
    ${visibility === 'public' && mode === 'supabase' ? '<button class="btn ghost" data-act="backToGuest" type="button">Back to reading</button>' : ''}`);
  setTimeout(() => $('#si-email')?.focus(), 30);
}
async function startSupabase(cfg){
  showGate('<p class="muted">Connecting…</p>');
  try{ await loadScript(SUPABASE_JS); }
  catch(e){ showGate('<h1>Cannot connect</h1><p>The sign-in system could not load. Check your internet connection and refresh the page.</p>'); return; }
  sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, flowType:'implicit'}});
  sb.auth.onAuthStateChange((ev, session) => {
    if(session && !sbHandled) setTimeout(() => afterSignIn(session), 0);
    if(ev === 'SIGNED_OUT'){ history.replaceState(null, '', location.pathname + location.search + '#overview'); location.reload(); }
  });
  const {data:{session}} = await sb.auth.getSession();
  await fetchVisibility();
  if(session) afterSignIn(session);
  else if(!/access_token=/.test(location.hash)){
    const expired = /error_description=/.test(location.hash);
    if(visibility === 'public' && !expired) enterGuest('');
    else showSignIn(expired ? 'That sign-in link has expired or was already used. Send a new one.' : '');
  }
}
async function fetchVisibility(){
  try{ const {data, error} = await sb.from('settings').select('value').eq('key', 'visibility').maybeSingle(); visibility = !error && data && data.value === 'public' ? 'public' : 'private'; }
  catch(e){ visibility = 'private'; }
  return visibility;
}
async function enterGuest(note){
  me.role = 'guest'; isAdmin = false; canWrite = false;
  hideGate(); mode = 'loading'; render();
  if(note) toast(note);
  await loadAllDocs(); subscribeDocs();
}
async function afterSignIn(session){
  if(sbHandled) return; sbHandled = true;
  me.email = (session.user.email || '').toLowerCase();
  if(/access_token=|error_description=|refresh_token=/.test(location.hash)) history.replaceState(null, '', location.pathname + location.search + '#overview');
  const {data, error} = await sb.from('members').select('email,role,person_name').eq('email', me.email).maybeSingle();
  if(error){ showGate(`<h1>Database not set up</h1><p>You are signed in as <b>${esc(me.email)}</b>, but the database is not ready. An admin needs to run <code>setup.sql</code> in Supabase, as described in the setup guide.</p><button class="btn" data-act="signOut" type="button">Sign out</button>`); return; }
  if(!data && visibility === 'public'){ enterGuest('You are signed in, but not invited yet, so you can read but not edit.'); return; }
  if(!data){ showGate(`<h1>Ask for access</h1><p>You are signed in as <b>${esc(me.email)}</b>, but this email has not been invited to this workspace. Ask one of its admins to invite you, then sign in again.</p><button class="btn" data-act="signOut" type="button">Sign out</button>`); return; }
  me.role = data.role; me.name = data.person_name || '';
  isAdmin = me.role === 'admin'; canWrite = me.role !== 'viewer';
  hideGate(); mode = 'loading'; render();
  await loadAllDocs(); subscribeDocs();
  if(me.name) await ensurePerson(me.name, me.email);
  else if(isAdmin) memberNameModal(me.email, '', 'Add the name others will see. You will appear in People and can be added to circles.');
}
async function loadAllDocs(){
  const all = []; let from = 0;
  while(true){
    const {data, error} = await sb.from('docs').select('col,id,data').range(from, from + 999);
    if(error){ toast('Could not load data. Refresh the page to try again.'); break; }
    all.push(...data); if(data.length < 1000) break; from += 1000;
  }
  COLS.forEach(c => S[c] = {});
  all.forEach(r => { if(S[r.col]) S[r.col][r.id] = {...r.data, id:r.id}; });
  mode = 'supabase'; render();
}
function subscribeDocs(){
  sb.channel('docs-changes').on('postgres_changes', {event:'*', schema:'public', table:'docs'}, p => {
    if(p.eventType === 'DELETE'){ const o = p.old || {}; if(S[o.col]) delete S[o.col][o.id]; }
    else { const r = p.new || {}; if(S[r.col]) S[r.col][r.id] = {...r.data, id:r.id}; }
    render();
  }).subscribe();
}
async function sbPut(col, obj){
  const {error} = await sb.from('docs').upsert({col, id:obj.id, data:obj});
  if(error){ toast(error.code === '42501' ? 'You do not have permission to change this.' : 'Could not save. Check your connection and try again.'); return false; }
  return true;
}
async function sbRemove(col, id){
  const {error} = await sb.from('docs').delete().eq('col', col).eq('id', id);
  if(error){ toast(error.code === '42501' ? 'You do not have permission to delete this.' : 'Could not delete. Try again.'); return false; }
  return true;
}
async function fetchMembers(){
  const {data, error} = await sb.from('members').select('email,role,person_name,created_at').order('email');
  membersList = error ? [] : data;
  if(error) toast('Could not load the member list.');
  render();
}
function inviteText(email){ const url = location.origin + location.pathname; return `You're invited to ${appName()}. Open ${url} and sign in with ${email}. You'll get an email with a sign-in link.`; }

      <label class="f"><span>Access</span><select id="inv-role">${Object.entries(ROLE_INFO).map(([k,[l]]) => `<option value="${k}" ${k==='member'?'selected':''}>${l}</option>`).join('')}</select></label>
      <label class="f"><span>Name</span><input id="inv-person" list="dl-people" required autocomplete="off" placeholder="As others will see it"></label>
      <div><button class="btn pri" type="submit">Invite</button></div>
    </form>
    ${lastInvite ? `<div class="invite-msg"><span class="eyebrow">Send them this message</span><p id="inv-text">${esc(lastInvite)}</p><div><button class="btn sm" data-act="copyText" data-t="${esc(lastInvite)}" type="button">Copy message</button></div></div>` : ''}
  </section>
  <section class="panel"><div class="ph"><h2>People with access</h2><span class="bl-meta">${counts.admin} admin${counts.admin===1?'':'s'} · ${counts.member} member${counts.member===1?'':'s'} · ${counts.viewer} viewer${counts.viewer===1?'':'s'}</span></div>
    <div class="tscroll"><table><thead><tr><th>Email</th><th>Name</th><th>Access</th><th></th></tr></thead><tbody>
      ${membersList.map(m => `<tr><td class="mono">${esc(m.email)}${m.email===me.email?' <span class="chip">You</span>':''}</td><td>${m.person_name ? `${person(m.person_name)} <button class="btn sm ghost" data-act="memberName" data-email="${esc(m.email)}" data-name="${esc(m.person_name)}" type="button">Change</button>` : `<button class="btn sm" data-act="memberName" data-email="${esc(m.email)}" type="button">Add name</button>`}</td>
        <td><select class="sel mrole" data-email="${esc(m.email)}" aria-label="Access for ${esc(m.email)}">${Object.entries(ROLE_INFO).map(([k,[l]]) => `<option value="${k}" ${k===m.role?'selected':''}>${l}</option>`).join('')}</select></td>
        <td><button class="btn sm ghost danger" data-act="memberRemove" data-email="${esc(m.email)}" type="button">Remove</button></td></tr>`).join('')}
    </tbody></table></div>
  </section>
  <section class="panel"><h2>What each level can do</h2><div class="tscroll"><table><tbody>${Object.values(ROLE_INFO).map(([l,d]) => `<tr><td><b>${l}</b></td><td>${d}</td></tr>`).join('')}</tbody></table></div>
    <p class="bl-meta">A workspace always keeps at least one admin. These rules are enforced by the database, not only by this page.</p></section>`;
}


/* ---------- Member picker: people come from the People directory ---------- */
function memberPicker(selected){
  const all = allPeopleNames(); const sel = new Set(selected || []);
  return `<div class="f"><span>Members</span><small>Tick the people in this circle. Everyone with an account, and everyone in People, is listed.</small>
    ${all.length > 8 ? '<input id="mp-filter" class="sel" placeholder="Filter by name" autocomplete="off" aria-label="Filter people">' : ''}
    <div class="mpick" id="mpick">${all.map(n => `<label class="chk mp" data-n="${esc(n.toLowerCase())}"><input type="checkbox" class="mp-cb" value="${esc(n)}" ${sel.has(n)?'checked':''}>${avatar(n)}<span>${esc(n)}</span></label>`).join('') || '<span class="muted">Nobody in People yet. Add names below.</span>'}</div>
    ${fText('f-members-new','Add someone who is not listed','',{ph:'Names separated by commas',hint:'They also appear in People.'})}</div>`;
}
function pickedMembers(){
  const picked = [...document.querySelectorAll('.mp-cb:checked')].map(x => x.value);
  const extra = gv('f-members-new').split(',').map(x => x.trim()).filter(Boolean);
  return [...new Set([...picked, ...extra])];
}
async function ensurePerson(name, email){
  name = String(name||'').trim(); if(!name || !canWrite) return null;
  let rec = personRec(name);
  if(!rec){ rec = {id:uid('p'), name, joined:todayISO(), updated:todayISO()}; if(!(await put('people', rec))) return null; }
  if(email && !(S.contacts[rec.id]?.email)) await put('contacts', {...(S.contacts[rec.id]||{}), id:rec.id, email});
  return rec;
}
function memberNameModal(email, current, intro){
  openModal(intro ? 'What is your name?' : 'Name in People', `${intro ? `<p class="muted" style="font-size:14px">${intro}</p>` : ''}${fText('mn-name','Name',current||'',{list:1,ph:'e.g. Lina Barbal',hint:'Shown in People, circles and tasks. If this person is already in People, pick their name.'})}`, async () => {
    const name = gv('mn-name'); if(!name){ toast('Add a name.'); return false; }
    const {error} = await sb.from('members').update({person_name:name}).eq('email', email);
    if(error){ toast('Could not save the name.'); return false; }
    await ensurePerson(name, email);
    if(email === me.email) me.name = name;
    toast('Name saved'); if(membersList !== null) fetchMembers(); render(); return true;
  }, {saveLabel:'Save name'});
}

/* ============ People directory ============ */
let peopleQ = '', peopleCircle = '', peopleRole = '';
let peopleView = (() => { try{ return localStorage.getItem('cc-peopleview') || 'grid'; }catch(e){ return 'grid'; } })();
let curPhoto = null;
const hashName = n => { let h = 0; for(const ch of String(n).trim().toLowerCase()) h = (h*31 + ch.charCodeAt(0)) >>> 0; return 'v' + h.toString(36); };
function personRec(n){ const l = String(n||'').trim().toLowerCase(); return l ? vals('people').find(p => (p.name||'').trim().toLowerCase() === l) : null; }
function pid(n){ return personRec(n)?.id || hashName(n); }
function allPeopleNames(){
  const m = new Map(); const add = n => { n = String(n||'').trim(); if(n && !m.has(n.toLowerCase())) m.set(n.toLowerCase(), n); };
  vals('people').forEach(p => add(p.name));
  vals('circles').forEach(c => { (c.members||[]).forEach(add); Object.values(c.roles||{}).forEach(r => add(r?.holder)); (c.extraRoles||[]).forEach(r => add(r.holder)); });
  vals('actions').forEach(a => add(a.owner)); vals('projects').forEach(j => add(j.owner));
  return [...m.values()].sort((a,b) => a.localeCompare(b));
}
function personRoles(n){
  const out = [];
  vals('circles').forEach(c => {
    ROLE_KEYS.forEach(([k,l]) => { if(c.roles?.[k]?.holder === n && needsRole(c,k)) out.push({c, role:l, key:k, termEnd:c.roles[k].termEnd}); });
    (c.extraRoles||[]).forEach(r => { if(r.holder === n) out.push({c, role:r.title, key:'x', termEnd:r.termEnd}); });
  });
  return out;
}
function personCircles(n){ const ids = new Set(vals('circles').filter(c => (c.members||[]).includes(n)).map(c => c.id)); personRoles(n).forEach(r => ids.add(r.c.id)); return [...ids].map(id => S.circles[id]).filter(Boolean).sort((a,b) => (a.name||'').localeCompare(b.name||'')); }
function personTasks(n){ return vals('actions').filter(a => a.owner === n && a.status !== 'done' && S.circles[a.circleId]); }
function avatar(n, cls){ const r = personRec(n); return r?.photo ? `<img class="${cls||'av'}" src="${esc(r.photo)}" alt="">` : `<span class="${cls||'av'}">${esc(initials(n))}</span>`; }
function person(n, link=true){ const inner = `${avatar(n)}${esc(n)}`; return link ? `<a class="person" href="#person-${pid(n)}">${inner}</a>` : `<span class="person">${inner}</span>`; }
const splitList = s => String(s||'').split(',').map(x => x.trim()).filter(Boolean);
function peopleRows(){
  const q = peopleQ.trim().toLowerCase();
  return allPeopleNames().map(n => ({n, rec:personRec(n), roles:personRoles(n), circles:personCircles(n), tasks:personTasks(n)}))
    .filter(p => !peopleCircle || p.circles.some(c => c.id === peopleCircle))
    .filter(p => !peopleRole || (peopleRole === 'none' ? !p.roles.length : peopleRole === 'any' ? p.roles.length : peopleRole === 'x' ? p.roles.some(r => r.key === 'x') : p.roles.some(r => r.key === peopleRole)))
    .filter(p => !q || [p.n, p.rec?.bio, p.rec?.skills, p.rec?.interests, ...p.circles.map(c => c.name), ...p.roles.map(r => r.role)].join(' ').toLowerCase().includes(q));
}
function loadLabel(p){ const r = p.roles.length; return r ? `${r} role${r===1?'':'s'} in ${new Set(p.roles.map(x => x.c.id)).size} circle${new Set(p.roles.map(x => x.c.id)).size===1?'':'s'}` : 'No roles'; }
function peopleList(){
  const rows = peopleRows();
  if(!rows.length) return emptyBox(allPeopleNames().length ? 'Nobody matches these filters.' : 'No people yet. People appear here when they are added to a circle, or you can add them directly.', `<button class="btn sm w" data-act="newPerson" type="button">Add a person</button>`);
  if(peopleView === 'list') return `<div class="tscroll"><table class="ptable"><thead><tr><th>Person</th><th>Circles</th><th>Roles</th><th>Open tasks</th><th>Skills</th><th>Availability</th></tr></thead><tbody>${rows.map(p => `<tr>
    <td><a class="person plain" href="#person-${pid(p.n)}">${avatar(p.n)}<b>${esc(p.n)}</b></a></td>
    <td>${p.circles.map(c => `<a href="#circle-${c.id}">${esc(c.name)}</a>`).join(', ') || '<span class="muted">—</span>'}</td>
    <td>${p.roles.map(r => `${esc(r.role)} <span class="muted">· ${esc(r.c.name)}</span>`).join('<br>') || '<span class="muted">—</span>'}</td>
    <td class="mono">${p.tasks.length}${p.tasks.some(a => a.due && daysUntil(a.due) < 0) ? ' <span style="color:var(--bad)">· overdue</span>' : ''}</td>
    <td>${splitList(p.rec?.skills).slice(0,3).map(esc).join(', ') || '<span class="muted">—</span>'}</td>
    <td>${esc(p.rec?.availability || '') || '<span class="muted">—</span>'}</td></tr>`).join('')}</tbody></table></div>`;
  return `<div class="ppl-grid">${rows.map(p => `<a class="ppl-card" href="#person-${pid(p.n)}">
    ${avatar(p.n, 'av-lg')}
    <b class="pc-name">${esc(p.n)}</b>
    ${p.roles.length ? `<div class="pc-roles">${p.roles.slice(0,3).map(r => `<span class="chip">${esc(r.role)} · ${esc(r.c.name.replace(/ Circle$/,''))}</span>`).join('')}${p.roles.length>3?`<span class="chip">+${p.roles.length-3}</span>`:''}</div>` : ''}
    <span class="bl-meta">${p.circles.length} circle${p.circles.length===1?'':'s'} · ${loadLabel(p)}${p.tasks.length?` · ${p.tasks.length} open task${p.tasks.length===1?'':'s'}`:''}</span>
    ${p.rec?.skills ? `<span class="muted pc-skills">${esc(splitList(p.rec.skills).slice(0,4).join(' · '))}</span>` : ''}
  </a>`).join('')}</div>`;
}
function vPeople(){
  const roleOpts = {'':'Any or no role', any:'Holds a role', leader:'Leaders', delegate:'Delegates', facilitator:'Facilitators', secretary:'Secretaries', x:'Other roles', none:'No role'};
  return `<div class="head"><div class="t"><span class="eyebrow">Community</span><h1>People</h1><p>Everyone in the community, the circles they belong to and the roles they hold.</p></div><div class="row"><button class="btn pri w" data-act="newPerson" type="button">Add a person</button></div></div>
  <div class="ptools">
    <input id="pq" class="sel" value="${esc(peopleQ)}" placeholder="Search names, skills, circles" aria-label="Search people" autocomplete="off">
    <select id="pf-circle" class="sel" aria-label="Circle"><option value="">All circles</option>${ordered().map(([c]) => `<option value="${c.id}" ${c.id===peopleCircle?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
    <select id="pf-role" class="sel" aria-label="Role">${Object.entries(roleOpts).map(([k,l]) => `<option value="${k}" ${k===peopleRole?'selected':''}>${l}</option>`).join('')}</select>
    <div class="seg" role="group" aria-label="View"><button type="button" data-act="peopleView" data-v="grid" class="${peopleView==='grid'?'on':''}">Grid</button><button type="button" data-act="peopleView" data-v="list" class="${peopleView==='list'?'on':''}">List</button></div>
  </div>
  <div id="people-list">${peopleList()}</div>`;
}
function vPerson(id){
  const n = allPeopleNames().find(x => pid(x) === id);
  if(!n) return mode==='loading' ? '' : emptyBox('This person is not in the directory.', `<a class="btn sm" href="#people">Back to people</a>`);
  const rec = personRec(n) || {}, roles = personRoles(n), circles = personCircles(n), tasks = personTasks(n);
  const contact = rec.id ? S.contacts[rec.id] : null;
  const def = (t, v) => v ? `<div class="def"><span class="eyebrow">${t}</span><div class="txt">${esc(v)}</div></div>` : '';
  const chips = (t, v) => splitList(v).length ? `<div class="def"><span class="eyebrow">${t}</span><div class="row">${splitList(v).map(x => `<span class="chip">${esc(x)}</span>`).join('')}</div></div>` : '';
  return `<nav class="crumb"><a href="#people">People</a><span>/</span><span>${esc(n)}</span></nav>
  <div class="prof-head">${avatar(n, 'av-xl')}<div class="t"><h1>${esc(n)}</h1><div class="les-meta"><span>${loadLabel({roles})}</span><span>${circles.length} circle${circles.length===1?'':'s'}</span>${rec.joined?`<span>Joined <span class="mono">${mdy(rec.joined)}</span></span>`:''}${rec.example?'<span class="chip">Example</span>':''}</div>${rec.bio?`<p class="lede">${esc(rec.bio)}</p>`:''}</div>
    <div class="row"><button class="btn w" data-act="editPerson" data-name="${esc(n)}" type="button">${rec.id?'Edit profile':'Complete profile'}</button></div></div>
  <div class="course-body">
    <div class="course-main">
      <section class="panel"><h2>Circles and roles</h2>${circles.length ? `<div class="tscroll"><table><thead><tr><th>Circle</th><th>Roles</th><th>Term ends</th></tr></thead><tbody>${circles.map(c => { const rs = roles.filter(r => r.c.id === c.id); return `<tr><td><a href="#circle-${c.id}"><b>${esc(c.name)}</b></a><div class="bl-meta">${CTYPES[c.type]||''}</div></td><td>${rs.map(r => esc(r.role)).join('<br>') || '<span class="muted">Member</span>'}</td><td class="mono">${rs.map(r => mdy(r.termEnd) || '—').join('<br>') || '—'}</td></tr>`; }).join('')}</tbody></table></div>` : '<p class="muted">Not in any circle yet.</p>'}</section>
      <section class="panel"><div class="ph"><h2>Open tasks</h2><a href="#work" class="bl-meta">All work</a></div>${tasks.length ? `<div class="tscroll"><table><thead><tr><th>Task</th><th>Circle</th><th>Owner</th><th>Due</th><th>Status</th></tr></thead><tbody>${tasks.sort((a,b)=>(a.due||'9').localeCompare(b.due||'9')).map(a => taskRow(a, true)).join('')}</tbody></table></div>` : '<p class="muted">No open tasks.</p>'}</section>
    </div>
    <aside class="course-side">
      <div class="side-card"><span class="eyebrow">Contact</span>${contact && (contact.email || contact.phone) ? `${contact.channel?`<div><b>Prefers:</b> ${esc(contact.channel)}</div>`:''}${contact.email?`<div class="row" style="gap:6px"><span class="mono" style="overflow-wrap:anywhere">${esc(contact.email)}</span><button class="btn sm ghost" data-act="copyText" data-t="${esc(contact.email)}" type="button">Copy</button></div>`:''}${contact.phone?`<div class="row" style="gap:6px"><span class="mono">${esc(contact.phone)}</span><button class="btn sm ghost" data-act="copyText" data-t="${esc(contact.phone)}" type="button">Copy</button></div>`:''}` : `<p class="muted" style="font-size:13.5px">${rec.id ? 'No contact details shared, or only members can see them.' : 'No profile yet.'}</p>`}</div>
      ${rec.availability ? `<div class="side-card"><span class="eyebrow">Availability</span><div>${esc(rec.availability)}</div></div>` : ''}
      ${chips('Skills', rec.skills) || chips('Interests', rec.interests) ? `<div class="side-card">${chips('Skills', rec.skills)}${chips('Interests', rec.interests)}</div>` : ''}
      ${rec.buddy ? `<div class="side-card"><span class="eyebrow">Buddy</span>${person(rec.buddy)}</div>` : ''}
    </aside>
  </div>`;

function readLogo(file){

async function renamePerson(o, n){

  for(const a of vals('actions')) if(a.owner === o) await put('actions', {...clone(a), owner:n});
  for(const j of vals('projects')) if(j.owner === o) await put('projects', {...clone(j), owner:n});
  for(const m of vals('meetings')){ const mm = clone(m); let ch = false; ['facilitator','secretary'].forEach(k => { if(mm[k] === o){ mm[k] = n; ch = true; } }); ['present','absent'].forEach(k => { if((mm[k]||[]).includes(o)){ mm[k] = mm[k].map(sw); ch = true; } }); if(ch) await put('meetings', mm); }

}

function sentHTML(list){ return (list||[]).filter(id=>S.circles[id]).map(id=>`<span class="sent">Sent to <a href="#circle-${id}-meetings">${esc(S.circles[id].name)}</a></span>`).join(''); }
function linkTargets(circleId){
  const c = S.circles[circleId]; if(!c) return [];
  const out = [];
  if(c.parentId && S.circles[c.parentId]) out.push({id:c.parentId, label:`${S.circles[c.parentId].name} (parent circle, via the delegate)`, carrier:c.roles?.delegate?.holder||''});
  childrenOf(circleId).forEach(k => out.push({id:k.id, label:`${k.name} (sub-circle, via its leader)`, carrier:k.roles?.leader?.holder||''}));
  vals('circles').filter(o => o.id!==circleId && !out.some(x=>x.id===o.id)).sort((a,b)=>(a.name||'').localeCompare(b.name||'')).forEach(o => out.push({id:o.id, label:o.name, carrier:''}));
  return out;
}
function sendTo(d){
  const isAg = d.kind === 'agenda';
  const src = isAg ? S.meetings[d.id] : S.proposals[d.id]; if(!src) return;
  const a = isAg ? (src.agenda||[])[+d.i] : null; if(isAg && !a) return;
  const targets = linkTargets(src.circleId); if(!targets.length) return;
  const title = isAg ? a.title : src.title;
  const note = isAg ? ([a.outcome, a.takeaway].filter(Boolean).join('\n') || a.notes || '') : (src.driver || '');
  const body = `<p class="muted" style="font-size:14px">The topic goes into the other circle's backlog, ready for a future agenda. Between linked circles, the delegate carries topics up to the parent circle and the leader carries them down to a sub-circle.</p>

    ${fText('st-by','Brought by',targets[0].carrier,{list:1,hint:'Filled in with the delegate or leader who links the two circles.'})}
    ${fText('st-text','Topic',title)}
    ${fArea('st-note','Context for the other circle',note,{rows:4})}`;
  openModal('Send to another circle', body, async () => {
    const tid = gv('st-target'), text = gv('st-text');
    if(!text){ toast('Add a topic.'); return false; }
    if(!S.circles[tid]) return false;
    const t = clone(S.circles[tid]);
    t.backlog = [...(t.backlog||[]), {text, note:gv('st-note'), fromCircleId:src.circleId, by:gv('st-by'), date:todayISO(), ref:(isAg?'meeting:':'proposal:')+src.id}];
    if(!(await put('circles', t))) return false;
    const s2 = clone(isAg ? S.meetings[d.id] : S.proposals[d.id]);
    if(isAg){ const ag = s2.agenda[+d.i]; ag.sentTo = [...new Set([...(ag.sentTo||[]), tid])]; await put('meetings', s2); }
    else { s2.sentTo = [...new Set([...(s2.sentTo||[]), tid])]; await put('proposals', s2); }
    toast('Added to the backlog of ' + t.name); return true;
  }, {saveLabel:'Send'});
}

/* ============ Who decides? search ============ */
const rxEsc = t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function hl(text, terms){ text = String(text||''); if(!terms.length) return esc(text); const re = new RegExp('(' + terms.map(rxEsc).join('|') + ')', 'gi'); return text.split(re).map((p,i) => i % 2 ? `<mark>${esc(p)}</mark>` : esc(p)).join(''); }
function snip(text, terms, len=200){ text = String(text||''); if(text.length <= len) return hl(text, terms); const l = text.toLowerCase(); let at = -1; terms.forEach(t => { const i = l.indexOf(t); if(i >= 0 && (at < 0 || i < at)) at = i; }); const start = Math.max(0, (at < 0 ? 0 : at) - 60); const piece = text.slice(start, start + len); return (start > 0 ? '…' : '') + hl(piece, terms) + (start + len < text.length ? '…' : ''); }
function vSearch(){
  return `<div class="head"><div class="t"><span class="eyebrow">Find</span><h1>Who decides?</h1><p>Search every circle's domain and aim, the policies in force, the wiki, community updates and meeting takeaways. The circle whose domain covers a topic is the one that decides it.</p></div></div>
  <input id="q" class="bigsearch" value="${esc(searchQ)}" placeholder="e.g. room booking, budget, new members" aria-label="Search" autocomplete="off">
  <div id="results" style="display:flex;flex-direction:column;gap:18px">${searchResults()}</div>`;
}
function searchResults(){
  const terms = [...new Set(searchQ.trim().toLowerCase().split(/\s+/).filter(t => t.length > 1))];
  const circles = ordered().map(([c]) => c);
  const ask = c => [c.roles?.leader?.holder && `Leader: ${esc(c.roles.leader.holder)}`, c.roles?.secretary?.holder && `Secretary: ${esc(c.roles.secretary.holder)}`].filter(Boolean).join(' · ');
  if(!terms.length){
    if(!circles.length) return emptyBox('No circles yet. Once circles have domains, you can search them here.');
    return `<section class="panel"><div class="ph"><h2>Domains at a glance</h2></div><div class="tscroll"><table><thead><tr><th>Circle</th><th>Decides on</th><th>Who to ask</th></tr></thead><tbody>${circles.map(c=>`<tr><td><a href="#circle-${c.id}"><b>${esc(c.name)}</b></a></td><td style="white-space:pre-wrap">${esc(c.domain||'—')}</td><td>${ask(c)||'—'}</td></tr>`).join('')}</tbody></table></div></section>`;
  }
  const score = fields => { const hit = new Set(); let s = 0; fields.forEach(([txt, w]) => { const l = String(txt||'').toLowerCase(); terms.forEach(t => { if(l.includes(t)){ hit.add(t); s += w; } }); }); return hit.size ? hit.size * 100 + s : 0; };
  const rank = (list, f) => list.map(x => [x, score(f(x))]).filter(x => x[1]).sort((a,b) => b[1]-a[1]).map(x => x[0]);
  const rc = rank(circles, c => [[c.domain,4],[c.name,3],[c.aim,2],[c.description,1],[Object.values(c.roleDescs||{}).map(r=>r.responsibilities).join(' '),1],[(c.extraRoles||[]).map(r=>r.title+' '+(r.description||'')).join(' '),1]]);
  const rp = rank(vals('proposals').filter(p=>p.stage==='consented'), p => [[p.title,3],[p.proposal,2],[p.driver,1]]);
  const rn = rank(vals('notices'), n => [[n.title,3],[n.body,1]]);
  const rw = rank(vals('wiki'), w => [[w.title,3],[w.summary,2],[w.body,1]]);
  const rm = rank(vals('meetings'), m => [[m.takeaways,2],[(m.agenda||[]).map(a=>a.title+' '+(a.outcome||'')).join(' '),1]]);
  if(!rc.length && !rp.length && !rn.length && !rm.length && !rw.length) return emptyBox(`Nothing matches “${esc(searchQ.trim())}”. If no circle's domain covers this topic, it belongs to the general circle until someone takes it on.`);
  const sec = (t, inner) => `<section class="panel"><div class="ph"><h2>${t}</h2></div>${inner}</section>`;
  let out = '';
  if(rc.length) out += sec('Circles that may decide this', `<div class="list">${rc.map((c,i)=>`<div class="item"><div class="body"><div class="res-h"><a class="ttl" href="#circle-${c.id}">${esc(c.name)}</a>${i===0?'<span class="st ok">Best match</span>':''}</div><div><span class="eyebrow">Decides on</span><div style="white-space:pre-wrap;overflow-wrap:anywhere">${hl(c.domain||'No domain written yet.', terms)}</div></div>${c.aim?`<div class="muted" style="font-size:13.5px">Aim: ${snip(c.aim, terms)}</div>`:''}${ask(c)?`<div class="bl-meta">${ask(c)}</div>`:''}</div><div class="side">${typeChip(c.type)}</div></div>`).join('')}</div>`);
  if(rp.length) out += sec('Policies in force', `<div class="list">${rp.map(p=>`<div class="item"><div class="body"><a class="ttl" href="#proposal-${p.id}">${hl(p.title, terms)}</a><div class="muted" style="font-size:13.5px">${snip(p.proposal||p.driver, terms)}</div><div class="bl-meta">${esc(circleName(p.circleId))}${p.decided?` · consented <span class="mono">${mdy(p.decided)}</span>`:''}</div></div></div>`).join('')}</div>`);
  if(rw.length) out += sec('Wiki pages', `<div class="list">${rw.slice(0,8).map(w=>`<div class="item"><div class="body"><a class="ttl" href="#wiki-${w.id}">${hl(w.title, terms)}</a><div class="muted" style="font-size:13.5px">${snip(w.summary || w.body, terms)}</div><div class="bl-meta">${esc(WCATS[w.category]||'')} · ${esc(circleName(w.circleId))}</div></div></div>`).join('')}</div>`);
  if(rn.length) out += sec('Community updates', `<div class="list">${rn.slice(0,8).map(n=>`<div class="item"><div class="body"><a class="ttl" href="#overview">${hl(n.title, terms)}</a><div class="muted" style="font-size:13.5px">${snip(n.body, terms)}</div><div class="bl-meta">${esc(circleName(n.circleId))} · <span class="mono">${mdy(n.date)}</span></div></div></div>`).join('')}</div>`);
  if(rm.length) out += sec('Meeting takeaways', `<div class="list">${rm.slice(0,8).map(m=>`<div class="item"><div class="body"><a class="ttl" href="#meeting-${m.id}">${esc(circleName(m.circleId))} · <span class="mono">${mdy(m.date)}</span></a><div class="muted" style="font-size:13.5px">${snip(m.takeaways || (m.agenda||[]).map(a=>a.title+': '+(a.outcome||'')).join(' · '), terms)}</div></div></div>`).join('')}</div>`);
  return out;
}

/* ============ Role selection ============ */
const DEFAULT_RESP = {

  delegate:'Represents this circle in the parent circle as a full member, carries topics up, and reports back.',
  facilitator:'Prepares and runs meetings, follows the meeting format, and guides consent and selection processes.',

function selectingCircle(c, key){ return key==='leader' && c.parentId && S.circles[c.parentId] ? S.circles[c.parentId] : c; }

function readSel(base){

function editSelection(id, circleId, roleKey){

async function completeSelection(){
  const s = readSel(curSel);
  if(!s.proposed) throw new Invalid('Choose the proposed candidate in step 4.');
  if(s.objections.some(o => !o.resolved)) throw new Invalid('Integrate every objection, or mark it integrated, before completing.');
  if(!s.candidateConsented) throw new Invalid('The candidate consents last. Tick the box when they do.');
  if(!S.circles[s.circleId]) throw new Invalid('This circle no longer exists.');
  s.status = 'complete'; s.outcome = 'consented';
  const c = clone(S.circles[s.circleId]);
  const rec = {holder:s.proposed, selected:s.date, termEnd:s.termEnd};
  if(ROLE_LABEL[s.roleKey]){
    c.roles = {...(c.roles||{}), [s.roleKey]: rec};
    c.roleDescs = {...(c.roleDescs||{}), [s.roleKey]: {responsibilities:s.responsibilities, qualifications:s.qualifications}};
  } else {
    const list = c.extraRoles || []; const i = list.findIndex(r => (r.title||'').toLowerCase() === s.roleTitle.toLowerCase());
    const entry = {...(list[i] || {}), title:s.roleTitle, ...rec, description:s.responsibilities, qualifications:s.qualifications};
    if(i >= 0) list[i] = entry; else list.push(entry);
    c.extraRoles = list;
  }
  if(!c.members?.includes(s.proposed) && s.roleKey !== 'leader') c.members = [...(c.members||[]), s.proposed];
  if(!(await put('circles', c))) return false;
  const selC = selectingCircle(c, s.roleKey);
  const n = {id:uid('n'), kind:'role', circleId:c.id, date:s.date, effective:s.date, affectsAll:false, selectionId:s.id, example:!!curSel.example,
    title:`${s.proposed} selected as ${s.roleTitle} of ${c.name}`,
    body:[`${selC.name} selected ${s.proposed} by consent.`, s.termEnd ? `The term ends ${mdy(s.termEnd)}.` : '', s.proposalReason ? `Why: ${s.proposalReason}` : ''].filter(Boolean).join(' ')};
  if(await put('notices', n)) s.noticeId = n.id;
  const ok = await put('selections', s);
  if(ok){ toast(`${s.proposed} is now ${s.roleTitle}`); location.hash = 'selection-' + s.id; }
  return ok;
}

  if(inv){ e.preventDefault(); const email = $('#inv-email').value.trim().toLowerCase(); if(!email) return;
    const pname = $('#inv-person').value.trim(); if(!pname){ toast('Add their name.'); return; }
    const {error} = await sb.from('members').insert({email, role:$('#inv-role').value, person_name:pname});
    if(error){ toast(error.code === '23505' ? 'This email already has access.' : 'Could not invite. Try again.'); return; }
    await ensurePerson(pname, email);
    lastInvite = inviteText(email); toast('Invited ' + email); fetchMembers(); return; }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form="ask"]'); if(!f) return; e.preventDefault();
  searchQ = (f.querySelector('input').value || '').trim(); location.hash = 'search';
});
document.addEventListener('input', e => {
  if(e.target.id === 'mp-filter'){ const q = e.target.value.trim().toLowerCase(); document.querySelectorAll('#mpick .mp').forEach(l => l.hidden = q && !l.dataset.n.includes(q)); return; }
  if(e.target.id === 'pq'){ peopleQ = e.target.value; const r = $('#people-list'); if(r) r.innerHTML = peopleList(); return; }
  if(e.target.id === 'wq'){ wikiQ = e.target.value; const r = $('#wiki-list'); if(r) r.innerHTML = wikiLists(); return; }
  if(e.target.id === 'q'){ searchQ = e.target.value; const r = $('#results'); if(r) r.innerHTML = searchResults(); return; }
  if(e.target.matches('input.date')){
    const el = e.target; const digits = el.value.replace(/\D/g,'').slice(0,8);
    let v = digits; if(digits.length > 4) v = digits.slice(0,2)+'/'+digits.slice(2,4)+'/'+digits.slice(4); else if(digits.length > 2) v = digits.slice(0,2)+'/'+digits.slice(2);
    if(e.inputType && e.inputType.startsWith('delete')) return; el.value = v; el.classList.remove('bad');
  }
});
document.addEventListener('submit', async e => {
  const f = e.target.closest('[data-form="backlog"]'); if(!f) return; e.preventDefault();
  const inp = f.querySelector('input'); const v = inp.value.trim(); if(!v) return;
  const c = clone(S.circles[f.dataset.circle]); c.backlog = [...(c.backlog||[]), v]; await put('circles', c);
});
/* Drag tasks between board columns */
let dragId = null;
document.addEventListener('dragstart', e => { const c = e.target.closest?.('.tcard'); if(!c || !canWrite) return; dragId = c.dataset.task; c.classList.add('dragging'); try{ e.dataTransfer.setData('text/plain', dragId); e.dataTransfer.effectAllowed = 'move'; }catch(x){} });
document.addEventListener('dragend', e => { document.querySelectorAll('.dragging,.col.over').forEach(x => x.classList.remove('dragging','over')); dragId = null; });
document.addEventListener('dragover', e => { const col = e.target.closest?.('.col'); if(!col || !dragId) return; e.preventDefault(); document.querySelectorAll('.col.over').forEach(x => x !== col && x.classList.remove('over')); col.classList.add('over'); });
document.addEventListener('drop', async e => { const col = e.target.closest?.('.col'); if(!col || !dragId) return; e.preventDefault(); const a = S.actions[dragId]; const st = col.dataset.status; dragId = null; if(a && a.status !== st){ await put('actions', {...clone(a), status:st, updated:todayISO()}); } });
boot();
</script>
